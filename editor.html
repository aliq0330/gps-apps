<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Editor Pro V3</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/theme/eclipse.min.css">

<style>
body { margin:0; font-family:Arial; height:100vh; display:flex; flex-direction:column; }

/* TOP BAR */
.topbar {
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:10px;
    background:#f5f5f5;
    border-bottom:1px solid #ddd;
}

.title { font-weight:bold; font-size:18px; }

.icons { display:flex; gap:10px; }

.icon {
    font-size:18px;
    cursor:pointer;
}

/* FILE TABS */
.tabs {
    display:flex;
    overflow-x:auto;
    background:#eee;
}

.tab {
    padding:10px 15px;
    cursor:pointer;
    color:#666;
}

.tab.active {
    background:white;
    color:black;
    border-bottom:2px solid black;
}

/* EDITOR */
.editor { flex:1; }

.CodeMirror { height:100%; font-size:14px; }

/* alternating lines */
.CodeMirror-line:nth-child(odd) {
    background: rgba(255,255,0,0.15);
}
.CodeMirror-line:nth-child(even) {
    background: rgba(0,150,255,0.15);
}

/* popup preview */
#previewPopup {
    position:fixed;
    top:0; left:0;
    width:100%; height:100%;
    background:white;
    display:none;
    flex-direction:column;
    z-index:999;
}

#previewHeader {
    background:black;
    color:white;
    padding:10px;
    display:flex;
    justify-content:space-between;
}

#previewFrame { flex:1; border:none; }

/* run options modal */
#runOptions {
    position:fixed;
    bottom:0;
    left:0;
    width:100%;
    background:white;
    border-top:1px solid #ccc;
    display:none;
    padding:10px;
}

.runBtn {
    width:100%;
    margin:5px 0;
    padding:12px;
    background:#007bff;
    color:white;
    border:none;
}
</style>
</head>

<body>

<div class="topbar">
    <div class="title">New project</div>
    <div class="icons">
        <div class="icon" onclick="saveFile()">💾</div>
        <div class="icon" onclick="openRunOptions()">▶️</div>
        <div class="icon" onclick="clearAll()">🧹</div>
    </div>
</div>

<div class="tabs">
    <div class="tab active" onclick="switchTab('html',event)">index.html</div>
    <div class="tab" onclick="switchTab('css',event)">style.css</div>
    <div class="tab" onclick="switchTab('js',event)">app.js</div>
</div>

<div class="editor">
<textarea id="htmlCode"><!DOCTYPE html>
<html>
<head>
<title>Title</title>
</head>
<body>
<h1>This is a Heading</h1>
<p>This is a paragraph.</p>
</body>
</html></textarea>

<textarea id="cssCode">body { font-family: Arial; }</textarea>
<textarea id="jsCode">console.log("çalışıyor");</textarea>
</div>

<!-- popup preview -->
<div id="previewPopup">
    <div id="previewHeader">
        <span>Preview</span>
        <span onclick="closePreview()">✖</span>
    </div>
    <iframe id="previewFrame"></iframe>
</div>

<!-- run options -->
<div id="runOptions">
    <button class="runBtn" onclick="runNewTab()">Yeni Sekmede Aç</button>
    <button class="runBtn" onclick="runPopup()">Pop-up Aç</button>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/htmlmixed/htmlmixed.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/css/css.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/javascript/javascript.min.js"></script>

<script>
const htmlEditor = CodeMirror.fromTextArea(document.getElementById("htmlCode"), {mode:"htmlmixed", lineNumbers:true});
const cssEditor = CodeMirror.fromTextArea(document.getElementById("cssCode"), {mode:"css", lineNumbers:true});
const jsEditor = CodeMirror.fromTextArea(document.getElementById("jsCode"), {mode:"javascript", lineNumbers:true});

cssEditor.getWrapperElement().style.display="none";
jsEditor.getWrapperElement().style.display="none";

function switchTab(tab,e){
    htmlEditor.getWrapperElement().style.display="none";
    cssEditor.getWrapperElement().style.display="none";
    jsEditor.getWrapperElement().style.display="none";

    document.querySelectorAll(".tab").forEach(t=>t.classList.remove("active"));

    if(tab==="html") htmlEditor.getWrapperElement().style.display="block";
    if(tab==="css") cssEditor.getWrapperElement().style.display="block";
    if(tab==="js") jsEditor.getWrapperElement().style.display="block";

    e.target.classList.add("active");
}

function buildCode(){
    return htmlEditor.getValue()
    + "<style>"+cssEditor.getValue()+"</style>"
    + "<script>"+jsEditor.getValue()+"<\/script>";
}

function openRunOptions(){
    document.getElementById("runOptions").style.display="block";
}

function runNewTab(){
    document.getElementById("runOptions").style.display="none";
    const w = window.open();
    w.document.write(buildCode());
}

function runPopup(){
    document.getElementById("runOptions").style.display="none";
    document.getElementById("previewPopup").style.display="flex";
    document.getElementById("previewFrame").srcdoc = buildCode();
}

function closePreview(){
    document.getElementById("previewPopup").style.display="none";
}

function saveFile(){
    const blob=new Blob([buildCode()],{type:"text/html"});
    const a=document.createElement("a");
    a.href=URL.createObjectURL(blob);
    a.download="project.html";
    a.click();
}

function clearAll(){
    if(confirm("Her şeyi silmek istiyor musun?")){
        htmlEditor.setValue("");
        cssEditor.setValue("");
        jsEditor.setValue("");
    }
}
</script>

</body>
</html>
