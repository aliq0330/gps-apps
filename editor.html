<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KodEdit</title>

<!-- Prism.js -->
<link href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/themes/prism-tomorrow.min.css" rel="stylesheet"/>
<link href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/plugins/line-numbers/prism-line-numbers.min.css" rel="stylesheet"/>

<style>
body {
  margin:0;
  font-family: monospace;
  background:#1e1e1e;
  color:white;
}

.topbar {
  display:flex;
  flex-wrap:wrap;
  padding:8px;
  background:#111;
  gap:5px;
}

button, input {
  padding:6px;
  border:none;
  border-radius:5px;
  font-size:12px;
}

button {
  background:#333;
  color:white;
}

.tabs {
  display:flex;
}

.tab {
  flex:1;
  padding:10px;
  text-align:center;
  background:#222;
  cursor:pointer;
}

.active {
  background:#444;
}

.editor {
  height:70vh;
  overflow:auto;
}

textarea {
  width:100%;
  height:100%;
  background:transparent;
  color:white;
  border:none;
  outline:none;
  font-family: monospace;
  font-size:14px;
  resize:none;
}

pre {
  margin:0;
}
</style>
</head>

<body>

<div class="topbar">
  <input id="filename" placeholder="dosya adı">
  <button onclick="saveFile()">Kaydet</button>
  <input type="file" onchange="loadFile(event)">
  <button onclick="clearCode()">Temizle</button>
  <button onclick="runCode()">Çalıştır</button>
</div>

<div class="tabs">
  <div class="tab active" onclick="switchTab('html')">HTML</div>
  <div class="tab" onclick="switchTab('css')">CSS</div>
  <div class="tab" onclick="switchTab('js')">JS</div>
</div>

<div class="editor">
  <pre class="line-numbers"><code id="highlight" class="language-html"></code></pre>
  <textarea id="code"></textarea>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/prism.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/plugins/line-numbers/prism-line-numbers.min.js"></script>

<script>
let currentTab = "html";

let codes = {
  html: "<h1>Merhaba</h1>",
  css: "body { background:black; color:white; }",
  js: "console.log('Hello');"
};

const textarea = document.getElementById("code");
const highlight = document.getElementById("highlight");

function updateHighlight() {
  highlight.textContent = textarea.value;
  highlight.className = "language-" + currentTab;
  Prism.highlightElement(highlight);
}

textarea.addEventListener("input", () => {
  codes[currentTab] = textarea.value;
  updateHighlight();
});

function switchTab(tab) {
  currentTab = tab;
  textarea.value = codes[tab];
  updateHighlight();

  document.querySelectorAll(".tab").forEach(t => t.classList.remove("active"));
  event.target.classList.add("active");
}

function saveFile() {
  let name = document.getElementById("filename").value || "deneme";

  let fullCode = `
<!DOCTYPE html>
<html>
<head>
<style>${codes.css}</style>
</head>
<body>
${codes.html}
<script>${codes.js}<\/script>
</body>
</html>`;

  let blob = new Blob([fullCode], {type:"text/html"});
  let a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = name + ".html";
  a.click();
}

function loadFile(e) {
  let file = e.target.files[0];
  let reader = new FileReader();

  reader.onload = function() {
    codes.html = reader.result;
    switchTab("html");
  };

  reader.readAsText(file);
}

function clearCode() {
  textarea.value = "";
  codes[currentTab] = "";
  updateHighlight();
}

function runCode() {
  let option = confirm("Tamam = Yeni Sekme\nİptal = Popup");

  let fullCode = `
<!DOCTYPE html>
<html>
<head>
<style>${codes.css}</style>
</head>
<body>
${codes.html}
<script>${codes.js}<\/script>
</body>
</html>`;

  if(option) {
    let win = window.open();
    win.document.write(fullCode);
  } else {
    let popup = window.open("", "popup", "width=400,height=600");
    popup.document.write(fullCode);
  }
}

// uzun bas -> kopyala
textarea.addEventListener("touchstart", function(e) {
  this.timer = setTimeout(() => {
    navigator.clipboard.writeText(textarea.value);
    alert("Kod kopyalandı!");
  }, 800);
});

textarea.addEventListener("touchend", function() {
  clearTimeout(this.timer);
});

// ilk yükleme
switchTab("html");
</script>

</body>
</html>
