* {
    -webkit-tap-highlight-color: transparent;
    -webkit-touch-callout: none;
    box-sizing: border-box;
}

html, body {
    height: 100%;
    margin: 0;
    padding: 0;
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    background: #0d1117;
    overflow: hidden;
}

.editor-font {
    font-family: 'JetBrains Mono', 'Consolas', 'Monaco', monospace;
    font-size: 14px;
    line-height: 1.7;
}

/* ✅ DÜZELTİLDİ: Sabit calc() kaldırıldı, height: 100% yapıldı */
.code-area {
    background: #161b22;
    width: 100%;
    height: 100%;
}

.code-input {
    width: 100%;
    height: 100%;
    padding: 16px;
    background: #161b22;
    color: #c9d1d9;
    border: none;
    resize: none;
    outline: none;
    white-space: pre-wrap;
    word-wrap: break-word;
    overflow-x: hidden;
    overflow-y: auto;
    tab-size: 2;
    caret-color: #58a6ff;
}

.tab-active {
    background: #238636;
    color: white;
    box-shadow: 0 2px 8px rgba(35, 134, 54, 0.3);
}

.tab-inactive {
    background: #21262d;
    color: #8b949e;
    border: 1px solid #30363d;
}

.tab-inactive:hover {
    background: #30363d;
    color: #c9d1d9;
}

.btn-primary {
    background: #1f6feb;
    box-shadow: 0 2px 8px rgba(31, 111, 235, 0.3);
}

.btn-primary:hover {
    background: #388bfd;
}

.btn-success {
    background: #238636;
    box-shadow: 0 2px 8px rgba(35, 134, 54, 0.3);
}

.btn-success:hover {
    background: #2ea043;
}

.btn-secondary {
    background: #21262d;
    border: 1px solid #30363d;
    color: #c9d1d9;
}

.btn-secondary:hover {
    background: #30363d;
}

.btn-danger {
    background: #da3633;
    box-shadow: 0 2px 8px rgba(218, 54, 51, 0.3);
}

.btn-danger:hover {
    background: #f85149;
}

.glass-panel {
    background: rgba(13, 17, 23, 0.95);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border-bottom: 1px solid #30363d;
}

@keyframes slideDown {
    from { opacity: 0; transform: translateY(-8px); }
    to { opacity: 1; transform: translateY(0); }
}

@keyframes fadeIn {
    from { opacity: 0; }
    to { opacity: 1; }
}

.animate-slide-down {
    animation: slideDown 0.2s ease-out;
}

.animate-fade-in {
    animation: fadeIn 0.2s ease-out;
}

.custom-scrollbar::-webkit-scrollbar {
    width: 8px;
    height: 8px;
}

.custom-scrollbar::-webkit-scrollbar-track {
    background: #161b22;
}

.custom-scrollbar::-webkit-scrollbar-thumb {
    background: #30363d;
    border-radius: 4px;
}

.custom-scrollbar::-webkit-scrollbar-thumb:hover {
    background: #484f58;
}

.context-menu-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.6);
    z-index: 999;
}

.context-menu {
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    background: #21262d;
    border: 1px solid #30363d;
    border-radius: 12px;
    padding: 8px 0;
    z-index: 1000;
    box-shadow: 0 25px 50px -12px rgba(0,0,0,0.8);
    min-width: 200px;
}

.context-menu-item {
    padding: 14px 20px;
    color: #c9d1d9;
    cursor: pointer;
    transition: all 0.15s;
    display: flex;
    align-items: center;
    gap: 12px;
    font-size: 15px;
}

.context-menu-item:hover {
    background: #30363d;
    color: #fff;
}

.context-menu-item:active {
    background: #1f6feb;
}

.run-menu {
    position: absolute;
    top: calc(100% + 8px);
    right: 0;
    background: #21262d;
    border: 1px solid #30363d;
    border-radius: 12px;
    overflow: hidden;
    box-shadow: 0 20px 40px rgba(0,0,0,0.6);
    min-width: 200px;
    z-index: 50;
}

.run-menu-item {
    padding: 14px 18px;
    color: #c9d1d9;
    cursor: pointer;
    transition: all 0.15s;
    display: flex;
    align-items: center;
    gap: 12px;
}

.run-menu-item:hover {
    background: #30363d;
    color: #fff;
}

.run-menu-item:active {
    background: #1f6feb;
}

.modal-input {
    background: #0d1117;
    border: 2px solid #30363d;
    border-radius: 10px;
    padding: 14px 18px;
    color: #fff;
    font-size: 16px;
    transition: all 0.2s;
    width: 100%;
}

.modal-input:focus {
    outline: none;
    border-color: #238636;
    box-shadow: 0 0 0 3px rgba(35, 134, 54, 0.15);
}

@media (max-width: 640px) {
    .editor-font {
        font-size: 13px;
    }
    .code-input {
        padding: 12px;
    }
}

.hidden { display: none !important; }

.accent-html { color: #ff7b72; }

<script>
    let loadedFilename = '';
    let code = '<!-- HTML kodunuzu buraya yazın -->\n<div class="container">\n  <h1>Merhaba Dünya!</h1>\n  <p>Mobil editöre hoş geldiniz.</p>\n</div>';

    document.addEventListener('DOMContentLoaded', () => {
        loadFromStorage();
        updateEditor();
        updateFilenameDisplay();
        
        document.addEventListener('click', (e) => {
            if (!e.target.closest('.relative')) {
                document.getElementById('runMenu').classList.add('hidden');
            }
        });

        let pressTimer;
        const editor = document.getElementById('editor');
        
        editor.addEventListener('touchstart', (e) => {
            pressTimer = setTimeout(() => {
                showContextMenu(e);
            }, 800);
        });
        
        editor.addEventListener('touchend', () => {
            clearTimeout(pressTimer);
        });
        
        editor.addEventListener('touchmove', () => {
            clearTimeout(pressTimer);
        });

        window.addEventListener('beforeunload', saveToStorage);
        
        document.getElementById('saveModalOverlay').addEventListener('click', (e) => {
            if (e.target.id === 'saveModalOverlay') {
                closeSaveModal();
            }
        });
    });

    function saveToStorage() {
        const data = {
            code: code,
            filename: loadedFilename,
            timestamp: new Date().toISOString()
        };
        localStorage.setItem('mobilKodEditor', JSON.stringify(data));
    }

    function loadFromStorage() {
        const saved = localStorage.getItem('mobilKodEditor');
        if (saved) {
            try {
                const data = JSON.parse(saved);
                if (data.code !== undefined) code = data.code;
                if (data.filename !== undefined) loadedFilename = data.filename;
            } catch (e) {
                console.error('Storage yükleme hatası:', e);
            }
        }
    }

    function generateDefaultFilename() {
        const now = new Date();
        const day = now.getDate().toString().padStart(2, '0');
        const month = (now.getMonth() + 1).toString().padStart(2, '0');
        const year = now.getFullYear();
        const hours = now.getHours().toString().padStart(2, '0');
        const minutes = now.getMinutes().toString().padStart(2, '0');
        return `dosya-${day}.${month}.${year}-${hours}.${minutes}`;
    }

    function updateFilenameDisplay() {
        const titleElement = document.getElementById('editorTitle');
        if (loadedFilename && loadedFilename.trim() !== '') {
            titleElement.textContent = loadedFilename + '.html';
            titleElement.classList.remove('text-[#8b949e]');
            titleElement.classList.add('text-[#58a6ff]');
        } else {
            titleElement.textContent = 'Yeni Dosya';
            titleElement.classList.remove('text-[#58a6ff]');
            titleElement.classList.add('text-[#8b949e]');
        }
    }

    function updateCode() {
        code = document.getElementById('editor').value;
        saveToStorage();
    }

    function openSaveModal() {
        const modal = document.getElementById('saveModalOverlay');
        const filenameInput = document.getElementById('saveFilename');
        
        if (loadedFilename && loadedFilename.trim() !== '') {
            filenameInput.value = loadedFilename;
        } else {
            filenameInput.value = generateDefaultFilename();
        }
        
        modal.classList.remove('hidden');
        modal.classList.add('flex');
        setTimeout(() => {
            filenameInput.focus();
            filenameInput.select();
        }, 100);
    }

    function closeSaveModal() {
        const modal = document.getElementById('saveModalOverlay');
        modal.classList.add('hidden');
        modal.classList.remove('flex');
    }

    function confirmSaveFromModal() {
        let filename = document.getElementById('saveFilename').value.trim();
        
        if (!filename) {
            showToast('Lütfen bir dosya adı girin');
            document.getElementById('saveFilename').focus();
            const input = document.getElementById('saveFilename');
            input.style.transform = 'translateX(-5px)';
            setTimeout(() => input.style.transform = 'translateX(5px)', 50);
            setTimeout(() => input.style.transform = 'translateX(-5px)', 100);
            setTimeout(() => input.style.transform = 'translateX(0)', 150);
            return;
        }
        
        if (!filename.endsWith('.html')) {
            filename += '.html';
        }
        
        const fullCode = `<!DOCTYPE html>\n<html>\n<head>\n    <meta charset="UTF-8">\n    <meta name="viewport" content="width=device-width, initial-scale=1.0">\n    <title>${filename}</title>\n</head>\n<body>\n${code}\n</body>\n</html>`;

        const blob = new Blob([fullCode], {type: 'text/html'});
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = filename;
        a.click();
        URL.revokeObjectURL(url);
        
        loadedFilename = filename.replace('.html', '');
        saveToStorage();
        updateFilenameDisplay();
        
        showToast(`${filename} indirildi`);
        closeSaveModal();
    }

    function updateEditor() {
        document.getElementById('editor').value = code;
    }

    function handleKeydown(e) {
        if (e.key === 'Tab') {
            e.preventDefault();
            const editor = e.target;
            const start = editor.selectionStart;
            const end = editor.selectionEnd;
            editor.value = editor.value.substring(0, start) + '  ' + editor.value.substring(end);
            editor.selectionStart = editor.selectionEnd = start + 2;
            updateCode();
        }
    }

    function toggleRunMenu() {
        const menu = document.getElementById('runMenu');
        menu.classList.toggle('hidden');
    }

    function runCode(mode) {
        document.getElementById('runMenu').classList.add('hidden');
        
        const fullCode = `<!DOCTYPE html>\n<html>\n<head>\n    <meta charset="UTF-8">\n    <meta name="viewport" content="width=device-width, initial-scale=1.0">\n</head>\n<body>\n    ${code}\n</body>\n</html>`;

        if (mode === 'newtab') {
            const blob = new Blob([fullCode], {type: 'text/html'});
            const url = URL.createObjectURL(blob);
            window.open(url, '_blank');
            showToast('Yeni sekmede açıldı');
        } else {
            const modal = document.getElementById('previewModal');
            const frame = document.getElementById('previewFrame');
            frame.srcdoc = fullCode;
            modal.classList.remove('hidden');
        }
    }

    function closePreview() {
        document.getElementById('previewModal').classList.add('hidden');
    }

    function loadFile() {
        document.getElementById('fileInput').click();
    }

    function handleFileLoad(event) {
        const file = event.target.files[0];
        if (!file) return;
        
        event.target.value = '';
        loadedFilename = file.name.replace(/\.[^/.]+$/, '');
        
        const reader = new FileReader();
        
        reader.onload = (e) => {
            code = e.target.result;
            saveToStorage();
            updateEditor();
            updateFilenameDisplay();
            showToast(file.name + ' yüklendi');
        };
        
        reader.onerror = () => {
            showToast('Dosya okunamadı');
        };
        
        reader.readAsText(file);
    }

    function clearCode() {
        if (confirm('Tüm kodları temizlemek istediğinize emin misiniz?')) {
            code = '';
            loadedFilename = '';
            saveToStorage();
            updateEditor();
            updateFilenameDisplay();
            showToast('Kodlar temizlendi');
        }
    }

    function showContextMenu(e) {
        e.preventDefault();
        document.getElementById('contextMenuOverlay').classList.remove('hidden');
        document.getElementById('contextMenu').classList.remove('hidden');
    }

    function hideContextMenu() {
        document.getElementById('contextMenuOverlay').classList.add('hidden');
        document.getElementById('contextMenu').classList.add('hidden');
    }

    function copyAll() {
        const editor = document.getElementById('editor');
        editor.select();
        document.execCommand('copy');
        hideContextMenu();
        showToast('Kopyalandı');
    }

    function pasteCode() {
        navigator.clipboard.readText().then(text => {
            const editor = document.getElementById('editor');
            const start = editor.selectionStart;
            editor.value = editor.value.substring(0, start) + text + editor.value.substring(editor.selectionEnd);
            editor.selectionStart = editor.selectionEnd = start + text.length;
            updateCode();
            hideContextMenu();
            showToast('Yapıştırıldı');
        }).catch(() => {
            showToast('Yapıştırma başarısız');
        });
    }

    function selectAll() {
        document.getElementById('editor').select();
        hideContextMenu();
    }

    function showToast(message) {
        const toast = document.getElementById('toast');
        document.getElementById('toastMessage').textContent = message;
        toast.classList.remove('hidden');
        toast.classList.add('flex');
        
        setTimeout(() => {
            toast.classList.add('hidden');
            toast.classList.remove('flex');
        }, 2000);
    }
</script>

</body>
</html>
