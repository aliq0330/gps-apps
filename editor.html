<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ultimate Editor V2</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.css">
<link id="themeStylesheet" rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/theme/dracula.min.css">

<style>
body { margin:0; font-family:Arial; display:flex; flex-direction:column; height:100vh; }

header { background:#111; color:white; padding:10px; text-align:center; }

.toolbar { display:flex; flex-wrap:wrap; gap:5px; padding:10px; background:#222; }

button { padding:10px; border:none; border-radius:5px; background:#007bff; color:white; }

.tabs {
    display:flex;
    overflow-x:auto;
}

.tab {
    min-width:80px;
    padding:10px;
    text-align:center;
    background:#333;
    color:white;
    cursor:pointer;
}

.tab.active { background:#007bff; }

.editor { flex:1; }

.CodeMirror { height:100%; }

/* alternating line colors */
.cm-s-dracula .CodeMirror-line:nth-child(odd) {
    background: rgba(255,255,0,0.1);
}
.cm-s-dracula .CodeMirror-line:nth-child(even) {
    background: rgba(0,200,255,0.1);
}

/* popup preview */
#popupPreview {
    position:fixed;
    top:0; left:0;
    width:100%;
    height:100%;
    background:white;
    z-index:9999;
    display:none;
    flex-direction:column;
}

#popupHeader {
    background:black;
    color:white;
    padding:10px;
    display:flex;
    justify-content:space-between;
}

#popupFrame {
    flex:1;
    border:none;
}

.closeBtn {
    cursor:pointer;
    font-size:18px;
}
</style>
</head>

<body>

<header>Ultimate Editor V2 🚀</header>

<div class="toolbar">
    <button onclick="runNewTab()">Yeni Sekme</button>
    <button onclick="runPopup()">Popup</button>
    <button onclick="saveFile()">Kaydet</button>
    <button onclick="toggleTheme()">Tema</button>
</div>

<div class="tabs">
    <div class="tab active" onclick="switchTab('html',event)">HTML</div>
    <div class="tab" onclick="switchTab('css',event)">CSS</div>
    <div class="tab" onclick="switchTab('js',event)">JS</div>
</div>

<div class="editor">
    <textarea id="htmlCode"><h1>Merhaba</h1></textarea>
    <textarea id="cssCode">body { font-family: Arial; }</textarea>
    <textarea id="jsCode">console.log("çalışıyor");</textarea>
</div>

<!-- popup -->
<div id="popupPreview">
    <div id="popupHeader">
        <span>Önizleme</span>
        <span class="closeBtn" onclick="closePopup()">✖</span>
    </div>
    <iframe id="popupFrame"></iframe>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/htmlmixed/htmlmixed.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/css/css.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/javascript/javascript.min.js"></script>

<script>
const htmlEditor = CodeMirror.fromTextArea(document.getElementById("htmlCode"), {mode:"htmlmixed", lineNumbers:true, theme:"dracula"});
const cssEditor = CodeMirror.fromTextArea(document.getElementById("cssCode"), {mode:"css", lineNumbers:true, theme:"dracula"});
const jsEditor = CodeMirror.fromTextArea(document.getElementById("jsCode"), {mode:"javascript", lineNumbers:true, theme:"dracula"});

cssEditor.getWrapperElement().style.display="none";
jsEditor.getWrapperElement().style.display="none";

function switchTab(tab,e){
    htmlEditor.getWrapperElement().style.display="none";
    cssEditor.getWrapperElement().style.display="none";
    jsEditor.getWrapperElement().style.display="none";

    document.querySelectorAll(".tab").forEach(t=>t.classList.remove("active"));

    if(tab==="html") htmlEditor.getWrapperElement().style.display="block";
    if(tab==="css") cssEditor.getWrapperElement().style.display="block";
    if(tab==="js") jsEditor.getWrapperElement().style.display="block";

    e.target.classList.add("active");
}

function buildCode(){
    return htmlEditor.getValue()
        + "<style>"+cssEditor.getValue()+"</style>"
        + "<script>"+jsEditor.getValue()+"<\/script>";
}

function runNewTab(){
    const w = window.open();
    w.document.write(buildCode());
    w.document.close();
}

function runPopup(){
    const popup = document.getElementById("popupPreview");
    const frame = document.getElementById("popupFrame");
    popup.style.display="flex";
    frame.srcdoc = buildCode();
}

function closePopup(){
    document.getElementById("popupPreview").style.display="none";
}

function saveFile(){
    const blob=new Blob([buildCode()],{type:"text/html"});
    const a=document.createElement("a");
    a.href=URL.createObjectURL(blob);
    a.download="kod.html";
    a.click();
}

function toggleTheme(){
    const t=document.getElementById("themeStylesheet");
    t.href = t.href.includes("dracula")
        ? "https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/theme/eclipse.min.css"
        : "https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/theme/dracula.min.css";
}

/* SELECT ALL FIX (mobil dahil) */
document.addEventListener("keydown", e=>{
    if((e.ctrlKey || e.metaKey) && e.key==="a"){
        e.preventDefault();
        const active = document.querySelector(".CodeMirror:not([style*='display: none'])");
        if(active && active.CodeMirror){
            active.CodeMirror.execCommand("selectAll");
        }
    }
});
</script>

</body>
</html>
