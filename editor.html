<!DOCTYPE html>

<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>KodEdit</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Syne:wght@600;800&display=swap');

:root {
–bg: #0d0f14;
–surface: #141720;
–surface2: #1c2030;
–border: #252a3a;
–accent: #5b8af5;
–accent2: #f5825b;
–accent3: #5bf5b0;
–text: #c8d0e8;
–text-dim: #5a6280;
–tab-active: #1c2030;
–tab-inactive: #0d0f14;
–line-num: #3a4060;
–gutter: 44px;
–header-h: 48px;
–tab-h: 44px;
}

- { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

html, body {
height: 100%; overflow: hidden;
background: var(–bg);
color: var(–text);
font-family: ‘JetBrains Mono’, monospace;
font-size: 13px;
}

/* ── TOP BAR ── */
#topbar {
display: flex; align-items: center; gap: 8px;
padding: 0 12px;
height: var(–header-h);
background: var(–surface);
border-bottom: 1px solid var(–border);
flex-shrink: 0;
}

#filename-input {
flex: 1;
background: var(–bg);
border: 1px solid var(–border);
border-radius: 6px;
color: var(–text);
font-family: ‘JetBrains Mono’, monospace;
font-size: 12px;
padding: 6px 10px;
outline: none;
min-width: 0;
transition: border-color .2s;
}
#filename-input::placeholder { color: var(–text-dim); }
#filename-input:focus { border-color: var(–accent); }

.btn {
display: flex; align-items: center; justify-content: center;
gap: 5px;
border: none; cursor: pointer;
border-radius: 6px;
font-family: ‘JetBrains Mono’, monospace;
font-size: 11px;
font-weight: 600;
padding: 7px 11px;
white-space: nowrap;
transition: all .15s;
-webkit-user-select: none; user-select: none;
}
.btn svg { flex-shrink: 0; }
.btn:active { transform: scale(0.94); }

#btn-save   { background: var(–accent);  color: #fff; }
#btn-upload { background: var(–surface2); color: var(–text); border: 1px solid var(–border); }
#btn-clear  { background: var(–surface2); color: var(–accent2); border: 1px solid var(–border); }
#btn-run    { background: var(–accent3);  color: #0a1a10; }

/* ── TAB BAR ── */
#tabbar {
display: flex;
height: var(–tab-h);
background: var(–tab-inactive);
border-bottom: 1px solid var(–border);
flex-shrink: 0;
}

.tab {
flex: 1; display: flex; align-items: center; justify-content: center;
gap: 6px; cursor: pointer;
font-family: ‘Syne’, sans-serif;
font-size: 13px; font-weight: 600;
color: var(–text-dim);
border-bottom: 2px solid transparent;
transition: all .2s;
-webkit-user-select: none; user-select: none;
letter-spacing: .03em;
}
.tab.active { background: var(–tab-active); color: var(–text); }
.tab[data-lang=“html”].active { border-bottom-color: var(–accent2); color: var(–accent2); }
.tab[data-lang=“css”].active  { border-bottom-color: var(–accent);  color: var(–accent);  }
.tab[data-lang=“js”].active   { border-bottom-color: var(–accent3); color: var(–accent3); }

.tab-dot {
width: 7px; height: 7px; border-radius: 50%;
}
.tab[data-lang=“html”] .tab-dot { background: var(–accent2); }
.tab[data-lang=“css”]  .tab-dot { background: var(–accent);  }
.tab[data-lang=“js”]   .tab-dot { background: var(–accent3); }

/* ── EDITOR AREA ── */
#editors {
flex: 1; overflow: hidden; position: relative;
}

.editor-pane {
display: none; position: absolute; inset: 0;
flex-direction: row;
}
.editor-pane.active { display: flex; }

/* Gutter */
.gutter {
width: var(–gutter);
background: var(–surface);
border-right: 1px solid var(–border);
overflow: hidden;
display: flex; flex-direction: column;
flex-shrink: 0;
padding-top: 12px;
user-select: none; -webkit-user-select: none;
}
.line-num {
height: 21px; line-height: 21px;
text-align: right;
padding-right: 8px;
color: var(–line-num);
font-size: 11px;
font-family: ‘JetBrains Mono’, monospace;
}

/* Textarea */
.code-wrap {
flex: 1; position: relative; overflow: auto;
-webkit-overflow-scrolling: touch;
}
.code-area {
width: 100%; height: 100%;
min-height: 100%;
background: transparent;
color: transparent;
caret-color: var(–accent);
border: none; outline: none; resize: none;
font-family: ‘JetBrains Mono’, monospace;
font-size: 13px;
line-height: 21px;
padding: 12px 12px 80px;
white-space: pre;
overflow-wrap: normal;
overflow-x: auto;
tab-size: 2;
position: absolute; inset: 0;
z-index: 2;
-webkit-user-select: text; user-select: text;
}
.highlight-layer {
position: absolute; inset: 0;
pointer-events: none;
font-family: ‘JetBrains Mono’, monospace;
font-size: 13px;
line-height: 21px;
padding: 12px 12px 80px;
white-space: pre;
overflow-wrap: normal;
overflow: hidden;
z-index: 1;
}

/* ── POPUP / MODAL ── */
.modal-overlay {
display: none; position: fixed; inset: 0;
background: rgba(0,0,0,.7); z-index: 100;
align-items: center; justify-content: center;
}
.modal-overlay.open { display: flex; }

.modal {
background: var(–surface);
border: 1px solid var(–border);
border-radius: 14px;
padding: 20px;
width: min(92vw, 320px);
box-shadow: 0 24px 64px rgba(0,0,0,.6);
}
.modal h3 {
font-family: ‘Syne’, sans-serif;
font-size: 15px; font-weight: 800;
color: var(–accent3);
margin-bottom: 16px;
letter-spacing: .04em;
}
.modal-btn {
display: flex; align-items: center; gap: 12px;
width: 100%; padding: 14px 16px;
background: var(–surface2);
border: 1px solid var(–border);
border-radius: 10px;
color: var(–text);
font-family: ‘JetBrains Mono’, monospace;
font-size: 13px; cursor: pointer;
margin-bottom: 10px;
transition: all .15s;
}
.modal-btn:last-of-type { margin-bottom: 0; }
.modal-btn:hover { border-color: var(–accent); color: var(–accent); }
.modal-btn:active { transform: scale(.97); }
.modal-close {
margin-top: 14px; text-align: center;
color: var(–text-dim); font-size: 12px;
cursor: pointer; padding: 4px;
}
.modal-close:hover { color: var(–text); }

/* ── PREVIEW POPUP ── */
#preview-overlay {
display: none; position: fixed; inset: 0;
background: rgba(0,0,0,.85); z-index: 200;
flex-direction: column;
}
#preview-overlay.open { display: flex; }

#preview-topbar {
display: flex; align-items: center;
padding: 10px 14px; gap: 10px;
background: var(–surface);
border-bottom: 1px solid var(–border);
flex-shrink: 0;
}
#preview-title {
flex: 1;
font-family: ‘Syne’, sans-serif;
font-size: 13px; font-weight: 700;
color: var(–accent3);
}
#preview-close {
background: var(–surface2); border: 1px solid var(–border);
color: var(–text-dim); border-radius: 6px;
padding: 6px 12px; cursor: pointer;
font-family: ‘JetBrains Mono’, monospace; font-size: 12px;
transition: all .15s;
}
#preview-close:hover { color: var(–accent2); border-color: var(–accent2); }
#preview-frame {
flex: 1; border: none; background: #fff;
}

/* ── COPY TOAST ── */
#toast {
position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%) translateY(20px);
background: var(–accent3); color: #0a1a10;
padding: 10px 20px; border-radius: 20px;
font-size: 12px; font-weight: 700;
opacity: 0; transition: all .3s;
z-index: 999; pointer-events: none;
white-space: nowrap;
}
#toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

/* ── RUN MENU DROPDOWN ── */
.run-menu {
display: none; position: absolute;
right: 0; top: calc(100% + 6px);
background: var(–surface);
border: 1px solid var(–border);
border-radius: 10px;
min-width: 180px;
box-shadow: 0 12px 36px rgba(0,0,0,.5);
z-index: 50;
overflow: hidden;
}
.run-menu.open { display: block; }
.run-menu-item {
display: flex; align-items: center; gap: 10px;
padding: 12px 16px;
cursor: pointer; font-size: 12px;
color: var(–text);
transition: background .15s;
border: none; background: none; width: 100%;
font-family: ‘JetBrains Mono’, monospace;
text-align: left;
}
.run-menu-item:hover { background: var(–surface2); }
.run-menu-item + .run-menu-item { border-top: 1px solid var(–border); }

#run-wrap { position: relative; }

/* Layout */
body { display: flex; flex-direction: column; height: 100dvh; }
#editors { flex: 1; overflow: hidden; }

/* scrollbar */
::-webkit-scrollbar { width: 4px; height: 4px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(–border); border-radius: 4px; }

/* ── SYNTAX COLORS ── */
.hl-tag    { color: #f5825b; }
.hl-attr   { color: #f5d05b; }
.hl-val    { color: #85d996; }
.hl-comment{ color: #4a5570; font-style: italic; }
.hl-string { color: #85d996; }
.hl-num    { color: #f5a05b; }
.hl-kw     { color: #5b8af5; }
.hl-fn     { color: #c985f5; }
.hl-prop   { color: #5bf5d0; }
.hl-sel    { color: #f5825b; }
.hl-unit   { color: #f5d05b; }
.hl-at     { color: #f5a05b; }

#upload-file { display: none; }

/* Long-press hint */
.editor-pane { touch-action: pan-x pan-y; }
</style>

</head>
<body>

<!-- TOP BAR -->

<div id="topbar">
  <input id="filename-input" type="text" placeholder="dosya adı gir…" spellcheck="false" autocomplete="off" autocorrect="off" autocapitalize="off">
  <button class="btn" id="btn-save" onclick="saveFile()">
    <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></svg>
    Kaydet
  </button>
  <button class="btn" id="btn-upload" onclick="document.getElementById('upload-file').click()">
    <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
    Yükle
  </button>
  <button class="btn" id="btn-clear" onclick="clearCode()">
    <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/></svg>
    Temizle
  </button>
  <div id="run-wrap">
    <button class="btn" id="btn-run" onclick="toggleRunMenu(event)">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polygon points="5 3 19 12 5 21 5 3"/></svg>
      Çalıştır
    </button>
    <div class="run-menu" id="run-menu">
      <button class="run-menu-item" onclick="runNewTab()">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>
        Yeni Sekmede Aç
      </button>
      <button class="run-menu-item" onclick="runPopup()">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18"/><path d="M9 21V9"/></svg>
        Popup Görüntüle
      </button>
    </div>
  </div>
  <input type="file" id="upload-file" accept=".html,.css,.js,.txt" onchange="loadFile(event)">
</div>

<!-- TAB BAR -->

<div id="tabbar">
  <div class="tab active" data-lang="html" onclick="switchTab('html')">
    <span class="tab-dot"></span>HTML
  </div>
  <div class="tab" data-lang="css" onclick="switchTab('css')">
    <span class="tab-dot"></span>CSS
  </div>
  <div class="tab" data-lang="js" onclick="switchTab('js')">
    <span class="tab-dot"></span>JS
  </div>
</div>

<!-- EDITORS -->

<div id="editors">
  <div class="editor-pane active" id="pane-html">
    <div class="gutter" id="gutter-html"></div>
    <div class="code-wrap" id="wrap-html">
      <div class="highlight-layer" id="hl-html" aria-hidden="true"></div>
      <textarea class="code-area" id="code-html" spellcheck="false" autocomplete="off" autocorrect="off" autocapitalize="off" placeholder="<!-- HTML kodunuzu buraya yazın -->"></textarea>
    </div>
  </div>
  <div class="editor-pane" id="pane-css">
    <div class="gutter" id="gutter-css"></div>
    <div class="code-wrap" id="wrap-css">
      <div class="highlight-layer" id="hl-css" aria-hidden="true"></div>
      <textarea class="code-area" id="code-css" spellcheck="false" autocomplete="off" autocorrect="off" autocapitalize="off" placeholder="/* CSS kodunuzu buraya yazın */"></textarea>
    </div>
  </div>
  <div class="editor-pane" id="pane-js">
    <div class="gutter" id="gutter-js"></div>
    <div class="code-wrap" id="wrap-js">
      <div class="highlight-layer" id="hl-js" aria-hidden="true"></div>
      <textarea class="code-area" id="code-js" spellcheck="false" autocomplete="off" autocorrect="off" autocapitalize="off" placeholder="// JavaScript kodunuzu buraya yazın"></textarea>
    </div>
  </div>
</div>

<!-- PREVIEW POPUP -->

<div id="preview-overlay">
  <div id="preview-topbar">
    <span id="preview-title">▶ Önizleme</span>
    <button id="preview-close" onclick="closePreview()">✕ Kapat</button>
  </div>
  <iframe id="preview-frame" sandbox="allow-scripts allow-same-origin allow-forms allow-modals"></iframe>
</div>

<!-- TOAST -->

<div id="toast">Kopyalandı!</div>

<script>
/* ═══════════════════════════════════════
   STATE
═══════════════════════════════════════ */
let currentLang = 'html';
const langs = ['html', 'css', 'js'];

/* ═══════════════════════════════════════
   TAB SWITCHING
═══════════════════════════════════════ */
function switchTab(lang) {
  currentLang = lang;
  document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.dataset.lang === lang));
  document.querySelectorAll('.editor-pane').forEach(p => p.classList.toggle('active', p.id === 'pane-' + lang));
  setTimeout(() => syncScroll(lang), 0);
}

/* ═══════════════════════════════════════
   SYNTAX HIGHLIGHTING
═══════════════════════════════════════ */
function escapeHTML(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function highlightHTML(code) {
  return escapeHTML(code)
    .replace(/(&lt;!--[\s\S]*?--&gt;)/g, '<span class="hl-comment">$1</span>')
    .replace(/(&lt;\/?)([\w-]+)/g, '<span class="hl-tag">$1$2</span>')
    .replace(/([\w-]+)(=)(&quot;[^"]*&quot;|&#39;[^']*&#39;|"[^"]*"|'[^']*')/g,
      '<span class="hl-attr">$1</span>$2<span class="hl-val">$3</span>');
}

function highlightCSS(code) {
  return escapeHTML(code)
    .replace(/(\/\*[\s\S]*?\*\/)/g, '<span class="hl-comment">$1</span>')
    .replace(/(@[\w-]+)/g, '<span class="hl-at">$1</span>')
    .replace(/([.#]?[\w-]+(?:\s*,\s*[.#]?[\w-]+)*)\s*\{/g, '<span class="hl-sel">$1</span>{')
    .replace(/([\w-]+)(\s*:\s*)/g, '<span class="hl-prop">$1</span>$2')
    .replace(/(\b\d+(?:\.\d+)?)(px|em|rem|%|vh|vw|vmin|vmax|s|ms|deg|fr)/g,
      '<span class="hl-num">$1</span><span class="hl-unit">$2</span>')
    .replace(/\b(\d+(?:\.\d+)?)\b/g, '<span class="hl-num">$1</span>')
    .replace(/(["'`][^"'`]*["'`])/g, '<span class="hl-string">$1</span>');
}

function highlightJS(code) {
  const kws = /\b(const|let|var|function|return|if|else|for|while|do|switch|case|break|continue|new|delete|typeof|instanceof|in|of|class|extends|import|export|default|try|catch|finally|throw|async|await|yield|this|super|null|undefined|true|false|void|static|get|set)\b/g;
  return escapeHTML(code)
    .replace(/(\/\/[^\n]*)/g, '<span class="hl-comment">$1</span>')
    .replace(/(\/\*[\s\S]*?\*\/)/g, '<span class="hl-comment">$1</span>')
    .replace(/(["'`][^"'`\n]*["'`])/g, '<span class="hl-string">$1</span>')
    .replace(kws, '<span class="hl-kw">$1</span>')
    .replace(/\b([A-Za-z_$][\w$]*)\s*\(/g, '<span class="hl-fn">$1</span>(')
    .replace(/\b(\d+(?:\.\d+)?)\b/g, '<span class="hl-num">$1</span>');
}

const highlighters = { html: highlightHTML, css: highlightCSS, js: highlightJS };

function updateHighlight(lang) {
  const ta = document.getElementById('code-' + lang);
  const hl = document.getElementById('hl-' + lang);
  const raw = ta.value;
  hl.innerHTML = highlighters[lang](raw);
  updateGutter(lang, raw);
}

/* ═══════════════════════════════════════
   GUTTERS (LINE NUMBERS)
═══════════════════════════════════════ */
function updateGutter(lang, code) {
  const gutter = document.getElementById('gutter-' + lang);
  const lines = (code.match(/\n/g) || []).length + 1;
  const current = gutter.children.length;
  if (current < lines) {
    for (let i = current + 1; i <= lines; i++) {
      const d = document.createElement('div');
      d.className = 'line-num';
      d.textContent = i;
      gutter.appendChild(d);
    }
  } else if (current > lines) {
    while (gutter.children.length > lines) gutter.removeChild(gutter.lastChild);
  }
}

/* Sync gutter scroll with textarea scroll */
function syncScroll(lang) {
  const wrap = document.getElementById('wrap-' + lang);
  const gutter = document.getElementById('gutter-' + lang);
  const hl = document.getElementById('hl-' + lang);
  const ta = document.getElementById('code-' + lang);

  ta.addEventListener('scroll', () => {
    gutter.scrollTop = ta.scrollTop;
    hl.scrollTop = ta.scrollTop;
    hl.scrollLeft = ta.scrollLeft;
  });
  wrap.addEventListener('scroll', () => {
    gutter.scrollTop = wrap.scrollTop;
  });
}

/* ═══════════════════════════════════════
   INPUT EVENTS
═══════════════════════════════════════ */
langs.forEach(lang => {
  const ta = document.getElementById('code-' + lang);
  ta.addEventListener('input', () => updateHighlight(lang));
  ta.addEventListener('keydown', e => {
    if (e.key === 'Tab') {
      e.preventDefault();
      const s = ta.selectionStart, end = ta.selectionEnd;
      ta.value = ta.value.substring(0, s) + '  ' + ta.value.substring(end);
      ta.selectionStart = ta.selectionEnd = s + 2;
      updateHighlight(lang);
    }
  });
  // Initialize
  updateHighlight(lang);
  syncScroll(lang);
});

/* ═══════════════════════════════════════
   LONG-PRESS → COPY ALL
═══════════════════════════════════════ */
let longPressTimer = null;
langs.forEach(lang => {
  const ta = document.getElementById('code-' + lang);

  const startLP = (e) => {
    if (ta.value.trim() === '') return;
    longPressTimer = setTimeout(() => {
      navigator.clipboard.writeText(ta.value).then(() => showToast('Tümü Kopyalandı!'));
    }, 600);
  };
  const cancelLP = () => clearTimeout(longPressTimer);

  ta.addEventListener('touchstart', startLP, { passive: true });
  ta.addEventListener('touchend', cancelLP);
  ta.addEventListener('touchmove', cancelLP);
  ta.addEventListener('mousedown', startLP);
  ta.addEventListener('mouseup', cancelLP);
  ta.addEventListener('mouseleave', cancelLP);
});

/* ═══════════════════════════════════════
   TOAST
═══════════════════════════════════════ */
function showToast(msg = 'Kopyalandı!') {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2000);
}

/* ═══════════════════════════════════════
   SAVE
═══════════════════════════════════════ */
function saveFile() {
  const html = document.getElementById('code-html').value;
  const css  = document.getElementById('code-css').value;
  const js   = document.getElementById('code-js').value;
  const name = (document.getElementById('filename-input').value.trim() || 'deneme');
  const fname = name.endsWith('.html') ? name : name + '.html';

  const content = buildHTML(html, css, js);
  const blob = new Blob([content], { type: 'text/html;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = fname;
  document.body.appendChild(a); a.click();
  document.body.removeChild(a);
  setTimeout(() => URL.revokeObjectURL(url), 1000);
  showToast('Dosya kaydedildi!');
}

/* ═══════════════════════════════════════
   UPLOAD
═══════════════════════════════════════ */
function loadFile(e) {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = ev => {
    const ext = file.name.split('.').pop().toLowerCase();
    let lang = 'html';
    if (ext === 'css') lang = 'css';
    if (ext === 'js')  lang = 'js';
    document.getElementById('code-' + lang).value = ev.target.result;
    updateHighlight(lang);
    switchTab(lang);
    // set filename
    document.getElementById('filename-input').value = file.name.replace(/\.[^.]+$/, '');
  };
  reader.readAsText(file);
  e.target.value = '';
}

/* ═══════════════════════════════════════
   CLEAR
═══════════════════════════════════════ */
function clearCode() {
  if (!confirm('Bu sekmedeki kodu temizlemek istediğinizden emin misiniz?')) return;
  const ta = document.getElementById('code-' + currentLang);
  ta.value = '';
  updateHighlight(currentLang);
}

/* ═══════════════════════════════════════
   RUN MENU
═══════════════════════════════════════ */
function toggleRunMenu(e) {
  e.stopPropagation();
  document.getElementById('run-menu').classList.toggle('open');
}
document.addEventListener('click', () => {
  document.getElementById('run-menu').classList.remove('open');
});

function buildHTML(html, css, js) {
  return `<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>${css}</style>

</head>
<body>
${html}
<script>${js}<\/script>
</body>
</html>`;
}

function getCode() {
return buildHTML(
document.getElementById(‘code-html’).value,
document.getElementById(‘code-css’).value,
document.getElementById(‘code-js’).value
);
}

function runNewTab() {
document.getElementById(‘run-menu’).classList.remove(‘open’);
const blob = new Blob([getCode()], { type: ‘text/html’ });
const url = URL.createObjectURL(blob);
window.open(url, ‘_blank’);
setTimeout(() => URL.revokeObjectURL(url), 3000);
}

function runPopup() {
document.getElementById(‘run-menu’).classList.remove(‘open’);
const frame = document.getElementById(‘preview-frame’);
const overlay = document.getElementById(‘preview-overlay’);
frame.srcdoc = getCode();
overlay.classList.add(‘open’);
}

function closePreview() {
document.getElementById(‘preview-overlay’).classList.remove(‘open’);
document.getElementById(‘preview-frame’).srcdoc = ‘’;
}

/* Close preview on overlay tap (outside iframe) */
document.getElementById(‘preview-overlay’).addEventListener(‘click’, function(e) {
if (e.target === this) closePreview();
});

/* Prevent run-menu close when clicking inside */
document.getElementById(‘run-menu’).addEventListener(‘click’, e => e.stopPropagation());
</script>

</body>
</html>
