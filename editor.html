<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Kod Editörü</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Inter:wght@400;500;600;700&display=swap');

        /* ── Reset ── */
        *, *::before, *::after {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            -webkit-touch-callout: none;
            margin: 0;
            padding: 0;
        }

        /* ── Theme Variables - System Auto Detect ── */
        :root {
            color-scheme: light dark;
            --bg-primary: #ffffff;
            --bg-secondary: #f6f8fa;
            --bg-tertiary: #eaeef2;
            --border-color: #d0d7de;
            --text-primary: #24292f;
            --text-secondary: #57606a;
            --accent-blue: #0969da;
            --accent-green: #1a7f37;
            --accent-purple: #8250df;
            --header-bg: rgba(255, 255, 255, 0.95);
            --shadow: 0 20px 40px rgba(0,0,0,0.15);
            --transition: all 0.3s ease;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg-primary: #0d1117;
                --bg-secondary: #161b22;
                --bg-tertiary: #21262d;
                --border-color: #30363d;
                --text-primary: #c9d1d9;
                --text-secondary: #8b949e;
                --accent-blue: #1f6feb;
                --accent-green: #238636;
                --accent-purple: #a371f7;
                --header-bg: rgba(13, 17, 23, 0.95);
                --shadow: 0 20px 40px rgba(0,0,0,0.6);
            }
        }

        /* ── Base ── */
        html, body {
            height: 100%;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            transition: background 0.3s ease, color 0.3s ease;
        }

        /* ── Klavye Açıkken Body Sabitleme ── */
        body.keyboard-open {
            position: fixed;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        svg { display: block; flex-shrink: 0; }

        /* ── Header ── */
        .header {
            background: var(--header-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border-color);
            padding: 12px 16px;
            flex-shrink: 0;
            z-index: 40;
            transition: background 0.3s ease, border-color 0.3s ease;
        }

        .header-top {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
        }

        .header-bottom {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            margin-top: 12px;
            padding-top: 12px;
            border-top: 1px solid var(--border-color);
        }

        /* ── Tab ── */
        .tab {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 8px 16px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: default;
            border: none;
            white-space: nowrap;
            font-family: inherit;
            background: var(--accent-green);
            color: white;
            box-shadow: 0 2px 8px rgba(35, 134, 54, 0.3);
        }

        .tab-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #ff7b72;
            flex-shrink: 0;
        }

        /* ── Buttons ── */
        .btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            border: none;
            cursor: pointer;
            font-family: inherit;
            font-weight: 500;
            border-radius: 8px;
            transition: all 0.2s;
            white-space: nowrap;
            font-size: 14px;
            padding: 8px 16px;
            color: white;
        }

        .btn:active { transform: scale(0.95); }

        .btn-primary {
            background: var(--accent-blue);
            box-shadow: 0 2px 8px rgba(31, 111, 235, 0.3);
            font-weight: 600;
        }
        .btn-primary:hover { background: #388bfd; }

        .btn-success {
            background: var(--accent-green);
            box-shadow: 0 2px 8px rgba(35, 134, 54, 0.3);
        }
        .btn-success:hover { background: #2ea043; }

        .btn-secondary {
            background: var(--bg-tertiary);
            border: 1px solid var(--border-color);
            color: var(--text-primary);
        }
        .btn-secondary:hover { background: var(--border-color); color: var(--text-primary); }

        .btn-sm {
            padding: 6px 12px;
            font-size: 13px;
        }

        /* ── Action group ── */
        .actions {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-shrink: 0;
        }

        /* ── File info ── */
        .file-info {
            display: flex;
            align-items: center;
            flex: 1;
            min-width: 0;
            overflow: hidden;
        }

        .editor-title {
            color: var(--text-secondary);
            font-size: 12px;
            font-family: 'JetBrains Mono', monospace;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .editor-title.loaded { color: var(--accent-blue); }

        /* ── Run dropdown ── */
        .run-wrapper { position: relative; }

        .run-menu {
            position: absolute;
            top: calc(100% + 8px);
            right: 0;
            background: var(--bg-tertiary);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            overflow: hidden;
            box-shadow: var(--shadow);
            min-width: 200px;
            z-index: 50;
            display: none;
        }

        .run-menu.open {
            display: block;
            animation: slideDown 0.2s ease-out;
        }

        .run-menu-item {
            padding: 14px 18px;
            color: var(--text-primary);
            cursor: pointer;
            transition: all 0.15s;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .run-menu-item:hover { background: var(--border-color); color: var(--text-primary); }
        .run-menu-item:active { background: var(--accent-blue); }

        .run-menu-label {
            font-size: 14px;
            font-weight: 500;
            line-height: 1.3;
        }

        .run-menu-desc {
            font-size: 12px;
            color: var(--text-secondary);
            margin-top: 2px;
        }

        .icon-purple { color: var(--accent-purple); }
        .icon-green  { color: #3fb950; }

        /* ── Main / Editor ── */
        main {
            flex: 1;
            min-height: 0;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        .code-area {
            background: var(--bg-secondary);
            width: 100%;
            flex: 1;
            min-height: 0;
            transition: background 0.3s ease;
            position: relative;
        }

        .code-input {
            width: 100%;
            height: 100%;
            padding: 16px;
            padding-bottom: 80px; /* Klavye butonu için boşluk */
            background: var(--bg-secondary);
            color: var(--text-primary);
            border: none;
            resize: none;
            outline: none;
            white-space: pre-wrap;
            word-wrap: break-word;
            overflow-x: hidden;
            overflow-y: auto;
            tab-size: 2;
            caret-color: var(--accent-blue);
            font-family: 'JetBrains Mono', 'Consolas', 'Monaco', monospace;
            font-size: 14px;
            line-height: 1.7;
            transition: background 0.3s ease, color 0.3s ease;
        }

        .code-input::-webkit-scrollbar        { width: 8px; height: 8px; }
        .code-input::-webkit-scrollbar-track  { background: var(--bg-secondary); }
        .code-input::-webkit-scrollbar-thumb  { background: var(--border-color); border-radius: 4px; }
        .code-input::-webkit-scrollbar-thumb:hover { background: var(--text-secondary); }

        /* ── Klavye Kapatma Butonu ── */
        .keyboard-close-btn {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: var(--bg-tertiary);
            border-top: 1px solid var(--border-color);
            padding: 12px 16px;
            display: none;
            align-items: center;
            justify-content: center;
            gap: 8px;
            z-index: 1000;
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            transition: transform 0.3s ease;
        }

        .keyboard-close-btn.visible {
            display: flex;
        }

        .keyboard-close-btn:active {
            background: var(--border-color);
        }

        .keyboard-close-icon {
            color: var(--text-primary);
        }

        .keyboard-close-text {
            color: var(--text-primary);
            font-size: 14px;
            font-weight: 500;
        }

        /* ── Hidden Copy Textarea ── */
        .hidden-copy-area {
            position: absolute;
            left: -9999px;
            top: -9999px;
            opacity: 0;
            pointer-events: none;
        }

        /* ── Floating Action Button ── */
        .fab-container {
            position: fixed;
            bottom: 24px;
            right: 24px;
            z-index: 100;
            transition: bottom 0.3s ease;
        }

        .fab-container.keyboard-open {
            bottom: 80px; /* Klavye butonu yüksekliği kadar yukarı */
        }

        .fab-main {
            width: 56px;
            height: 56px;
            border-radius: 50%;
            background: var(--accent-blue);
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 15px rgba(31, 111, 235, 0.4);
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            position: relative;
            z-index: 102;
        }

        .fab-main:hover {
            transform: scale(1.1);
            box-shadow: 0 6px 20px rgba(31, 111, 235, 0.5);
        }

        .fab-main:active {
            transform: scale(0.95);
        }

        .fab-main.active {
            transform: rotate(45deg);
            background: #da3633;
            box-shadow: 0 4px 15px rgba(218, 54, 51, 0.4);
        }

        .fab-icon {
            color: white;
            transition: transform 0.3s ease;
        }

        /* ── FAB Menu ── */
        .fab-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.5);
            z-index: 99;
            display: none;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .fab-overlay.open {
            display: block;
            opacity: 1;
        }

        .fab-menu {
            position: absolute;
            bottom: 70px;
            right: 0;
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 12px;
            opacity: 0;
            transform: translateY(20px) scale(0.8);
            pointer-events: none;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            transform-origin: bottom right;
        }

        .fab-menu.open {
            opacity: 1;
            transform: translateY(0) scale(1);
            pointer-events: all;
        }

        .fab-menu-item {
            display: flex;
            align-items: center;
            gap: 12px;
            background: var(--bg-tertiary);
            border: 1px solid var(--border-color);
            border-radius: 50px;
            padding: 12px 20px;
            color: var(--text-primary);
            cursor: pointer;
            box-shadow: var(--shadow);
            transition: all 0.2s ease;
            white-space: nowrap;
            transform: translateX(20px);
            opacity: 0;
        }

        .fab-menu.open .fab-menu-item {
            transform: translateX(0);
            opacity: 1;
        }

        .fab-menu.open .fab-menu-item:nth-child(1) { transition-delay: 0.05s; }
        .fab-menu.open .fab-menu-item:nth-child(2) { transition-delay: 0.1s; }
        .fab-menu.open .fab-menu-item:nth-child(3) { transition-delay: 0.15s; }

        .fab-menu-item:hover {
            background: var(--border-color);
            transform: scale(1.05);
        }

        .fab-menu-item:active {
            transform: scale(0.95);
        }

        .fab-menu-icon {
            width: 20px;
            height: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .fab-menu-text {
            font-size: 14px;
            font-weight: 500;
        }

        /* ── Preview Modal ── */
        .preview-modal {
            position: fixed;
            inset: 0;
            background: var(--bg-primary);
            z-index: 50;
            display: none;
            flex-direction: column;
        }

        .preview-modal.open { display: flex; }

        .preview-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px;
            border-bottom: 1px solid var(--border-color);
            background: var(--bg-secondary);
            flex-shrink: 0;
        }

        .preview-title {
            font-size: 18px;
            font-weight: 600;
            color: var(--text-primary);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .preview-close {
            background: none;
            border: none;
            color: var(--text-secondary);
            cursor: pointer;
            padding: 8px;
            border-radius: 8px;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .preview-close:hover { color: var(--text-primary); background: var(--border-color); }

        .preview-frame {
            flex: 1;
            width: 100%;
            background: white;
            border: none;
        }

        /* ── Save Modal ── */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.8);
            z-index: 50;
            display: none;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
        }

        .modal-overlay.open {
            display: flex;
            animation: fadeIn 0.2s ease-out;
        }

        .modal-box {
            background: var(--bg-secondary);
            border-radius: 16px;
            padding: 24px;
            width: 92%;
            max-width: 380px;
            box-shadow: 0 25px 50px -12px rgba(0,0,0,0.8);
            border: 1px solid var(--border-color);
            animation: slideDown 0.2s ease-out;
        }

        .modal-header {
            text-align: center;
            margin-bottom: 24px;
        }

        .modal-icon-wrap {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 56px;
            height: 56px;
            background: rgba(35, 134, 54, 0.2);
            border-radius: 50%;
            margin-bottom: 16px;
        }

        .modal-title {
            font-size: 20px;
            font-weight: 700;
            color: var(--text-primary);
            margin-bottom: 4px;
        }

        .modal-subtitle {
            font-size: 14px;
            color: var(--text-secondary);
        }

        .modal-field { margin-bottom: 24px; }

        .modal-label {
            display: block;
            font-size: 14px;
            font-weight: 500;
            color: var(--text-primary);
            margin-bottom: 8px;
            margin-left: 4px;
        }

        .modal-input-wrap { position: relative; }

        .modal-input {
            background: var(--bg-primary);
            border: 2px solid var(--border-color);
            border-radius: 10px;
            padding: 14px 60px 14px 18px;
            color: var(--text-primary);
            font-size: 16px;
            font-family: inherit;
            transition: all 0.2s;
            width: 100%;
        }

        .modal-input:focus {
            outline: none;
            border-color: var(--accent-green);
            box-shadow: 0 0 0 3px rgba(35, 134, 54, 0.15);
        }

        .modal-input-suffix {
            position: absolute;
            right: 16px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-secondary);
            font-weight: 500;
            pointer-events: none;
            font-size: 14px;
        }

        .modal-actions {
            display: flex;
            gap: 12px;
        }

        .modal-btn {
            flex: 1;
            padding: 14px;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            font-family: inherit;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            border: none;
            color: white;
        }

        .modal-btn:active { transform: scale(0.95); }

        .modal-btn-cancel {
            background: var(--bg-tertiary);
            border: 1px solid var(--border-color);
            color: var(--text-primary);
        }
        .modal-btn-cancel:hover { background: var(--border-color); }

        .modal-btn-save {
            background: var(--accent-green);
            box-shadow: 0 2px 8px rgba(35, 134, 54, 0.3);
        }
        .modal-btn-save:hover { background: #2ea043; }

        /* ── Toast ── */
        .toast {
            position: fixed;
            bottom: 90px;
            left: 50%;
            transform: translateX(-50%);
            background: var(--bg-tertiary);
            color: var(--text-primary);
            padding: 12px 24px;
            border-radius: 999px;
            box-shadow: var(--shadow);
            border: 1px solid var(--border-color);
            display: none;
            align-items: center;
            gap: 8px;
            z-index: 60;
            white-space: nowrap;
            font-size: 14px;
        }

        .toast.open { display: flex; }

        /* Klavye açıkken toast yukarıda */
        body.keyboard-open .toast {
            bottom: 160px;
        }

        /* ── Animations ── */
        @keyframes slideDown {
            from { opacity: 0; transform: translateY(-8px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to   { opacity: 1; }
        }

        /* ── Responsive ── */
        @media (max-width: 480px) {
            .code-input { font-size: 13px; padding: 12px; padding-bottom: 80px; }
            .btn        { font-size: 13px; padding: 7px 12px; }
            .btn-sm     { font-size: 12px; padding: 5px 10px; }
            .fab-container { bottom: 20px; right: 20px; }
            .fab-container.keyboard-open { bottom: 76px; }
            .fab-main { width: 52px; height: 52px; }
            .keyboard-close-btn { padding: 10px 16px; }
        }
    </style>
</head>

<body>

<!-- ══ HEADER ══ -->
<header class="header">
    <!-- Top row: tab + actions -->
    <div class="header-top">
        <div>
            <span class="tab">
                <span class="tab-dot"></span>
                HTML
            </span>
        </div>

        <div class="actions">
            <button onclick="clearCode()" class="btn btn-secondary">
                <svg width="16" height="16" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                          d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/>
                </svg>
                Temizle
            </button>

            <div class="run-wrapper">
                <button onclick="toggleRunMenu()" class="btn btn-primary">
                    <svg width="16" height="16" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                              d="M14.752 11.168l-3.197-2.132A1 1 0 0010 9.87v4.263a1 1 0 001.555.832l3.197-2.132a1 1 0 000-1.664z"/>
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                              d="M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/>
                    </svg>
                    Çalıştır
                    <svg width="16" height="16" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/>
                    </svg>
                </button>

                <div id="runMenu" class="run-menu">
                    <div class="run-menu-item" onclick="runCode('popup')">
                        <svg width="20" height="20" fill="none" stroke="currentColor" viewBox="0 0 24 24"
                             class="icon-purple">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                  d="M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6zM14 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2zM14 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z"/>
                        </svg>
                        <div>
                            <div class="run-menu-label">Popup Görüntüle</div>
                            <div class="run-menu-desc">Tam ekranda önizle</div>
                        </div>
                    </div>

                    <div class="run-menu-item" onclick="runCode('newtab')">
                        <svg width="20" height="20" fill="none" stroke="currentColor" viewBox="0 0 24 24"
                             class="icon-green">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                  d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14"/>
                        </svg>
                        <div>
                            <div class="run-menu-label">Yeni Sekme</div>
                            <div class="run-menu-desc">Yeni sekmede aç</div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Bottom row: filename + file ops -->
    <div class="header-bottom">
        <div class="file-info">
            <span id="editorTitle" class="editor-title">Yeni Dosya</span>
        </div>

        <div class="actions">
            <button onclick="openSaveModal()" class="btn btn-success btn-sm">
                <svg width="16" height="16" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                          d="M8 7H5a2 2 0 00-2 2v9a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2h-3m-1 4l-3 3m0 0l-3-3m3 3V4"/>
                </svg>
                Kaydet
            </button>

            <button onclick="loadFile()" class="btn btn-secondary btn-sm">
                <svg width="16" height="16" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                          d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12"/>
                </svg>
                Yükle
            </button>

            <input type="file" id="fileInput"
                   accept=".html,.htm,.txt,.text,.js,.css,.json,.xml,.md"
                   style="display:none"
                   onchange="handleFileLoad(event)">
        </div>
    </div>
</header>

<!-- ══ EDITOR ══ -->
<main>
    <div class="code-area">
        <textarea id="editor" class="code-input" spellcheck="false"
                  oninput="updateCode()"
                  onkeydown="handleKeydown(event)"
                  onfocus="onEditorFocus()"
                  onblur="onEditorBlur()"></textarea>
    </div>
</main>

<!-- ══ HIDDEN COPY TEXTAREA (for copy without keyboard) ══ -->
<textarea id="hiddenCopyArea" class="hidden-copy-area" readonly></textarea>

<!-- ══ KLAVYE KAPATMA BUTONU ══ -->
<div id="keyboardCloseBtn" class="keyboard-close-btn" onclick="closeKeyboard()">
    <svg class="keyboard-close-icon" width="20" height="20" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/>
    </svg>
    <span class="keyboard-close-text">Klavyeyi Kapat</span>
</div>

<!-- ══ FLOATING ACTION BUTTON ══ -->
<div class="fab-overlay" id="fabOverlay" onclick="toggleFabMenu()"></div>
<div class="fab-container" id="fabContainer">
    <div class="fab-menu" id="fabMenu">
        <div class="fab-menu-item" onclick="scrollToTop()">
            <div class="fab-menu-icon">
                <svg width="18" height="18" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 10l7-7m0 0l7 7m-7-7v18"/>
                </svg>
            </div>
            <span class="fab-menu-text">Yukarı Çık</span>
        </div>
        <div class="fab-menu-item" onclick="copyAll()">
            <div class="fab-menu-icon">
                <svg width="18" height="18" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z"/>
                </svg>
            </div>
            <span class="fab-menu-text">Tümünü Kopyala</span>
        </div>
        <div class="fab-menu-item" onclick="pasteCode()">
            <div class="fab-menu-icon">
                <svg width="18" height="18" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"/>
                </svg>
            </div>
            <span class="fab-menu-text">Yapıştır</span>
        </div>
    </div>
    
    <button class="fab-main" id="fabMain" onclick="toggleFabMenu()" aria-label="Menü">
        <svg class="fab-icon" width="24" height="24" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 5v14M5 12h14"/>
        </svg>
    </button>
</div>

<!-- ══ PREVIEW MODAL ══ -->
<div id="previewModal" class="preview-modal">
    <div class="preview-header">
        <div class="preview-title">
            <svg width="20" height="20" fill="none" stroke="#3fb950" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                      d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                      d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/>
            </svg>
            Önizleme
        </div>
        <button class="preview-close" onclick="closePreview()">
            <svg width="24" height="24" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
            </svg>
        </button>
    </div>
    <iframe id="previewFrame" class="preview-frame"></iframe>
</div>

<!-- ══ SAVE MODAL ══ -->
<div id="saveModalOverlay" class="modal-overlay" onclick="handleOverlayClick(event)">
    <div class="modal-box">
        <div class="modal-header">
            <div class="modal-icon-wrap">
                <svg width="28" height="28" fill="none" stroke="#3fb950" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                          d="M8 7H5a2 2 0 00-2 2v9a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2h-3m-1 4l-3 3m0 0l-3-3m3 3V4"/>
                </svg>
            </div>
            <div class="modal-title">Dosyayı Kaydet</div>
            <div class="modal-subtitle">HTML dosyası olarak indirin</div>
        </div>

        <div class="modal-field">
            <label class="modal-label" for="saveFilename">Dosya Adı</label>
            <div class="modal-input-wrap">
                <input type="text" id="saveFilename" class="modal-input"
                       placeholder="dosya-30.03.2026-20.29"
                       onkeypress="if(event.key==='Enter') confirmSaveFromModal()">
                <span class="modal-input-suffix">.html</span>
            </div>
        </div>

        <div class="modal-actions">
            <button onclick="closeSaveModal()" class="modal-btn modal-btn-cancel">İptal</button>
            <button onclick="confirmSaveFromModal()" class="modal-btn modal-btn-save">
                <svg width="20" height="20" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                          d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"/>
                </svg>
                İndir
            </button>
        </div>
    </div>
</div>

<!-- ══ TOAST ══ -->
<div id="toast" class="toast">
    <svg width="20" height="20" fill="none" stroke="#3fb950" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/>
    </svg>
    <span id="toastMessage">İşlem başarılı</span>
</div>

<script>
    let loadedFilename = '';
    let code = `<!-- HTML kodunuzu buraya yazın -->
<div class="container">
  <h1>Merhaba Dünya!</h1>
  <p>Mobil editöre hoş geldiniz.</p>
</div>`;
    let isFabOpen = false;
    let isKeyboardOpen = false;

    document.addEventListener('DOMContentLoaded', () => {
        loadFromStorage();
        updateEditor();
        updateFilenameDisplay();

        // Klavye boyut değişikliklerini dinle
        if ('visualViewport' in window) {
            window.visualViewport.addEventListener('resize', handleVisualViewportChange);
        }

        // Focus/blur eventleri
        const editor = document.getElementById('editor');
        editor.addEventListener('focus', onEditorFocus);
        editor.addEventListener('blur', onEditorBlur);

        document.addEventListener('click', (e) => {
            if (!e.target.closest('.run-wrapper')) {
                document.getElementById('runMenu').classList.remove('open');
            }
        });

        window.addEventListener('beforeunload', saveToStorage);
    });

    // Klavye Durum Yönetimi
    function handleVisualViewportChange() {
        if (!window.visualViewport) return;
        
        const viewportHeight = window.visualViewport.height;
        const windowHeight = window.innerHeight;
        const keyboardHeight = windowHeight - viewportHeight;
        
        // Klavye açık mı kontrol et (50px'den fazla fark varsa)
        if (keyboardHeight > 50) {
            if (!isKeyboardOpen) {
                isKeyboardOpen = true;
                onKeyboardOpen();
            }
        } else {
            if (isKeyboardOpen) {
                isKeyboardOpen = false;
                onKeyboardClose();
            }
        }
    }

    function onEditorFocus() {
        // iOS'ta visualViewport hemen güncellenmeyebilir, kısa gecikme ekle
        setTimeout(() => {
            if (window.visualViewport && window.innerHeight - window.visualViewport.height > 50) {
                if (!isKeyboardOpen) {
                    isKeyboardOpen = true;
                    onKeyboardOpen();
                }
            } else {
                // Android/iOS farklı davranabilir, manuel kontrol
                onKeyboardOpen();
            }
        }, 100);
    }

    function onEditorBlur() {
        // Blur hemen gerçekleşir, kısa gecikme ile kontrol et
        setTimeout(() => {
            const activeElement = document.activeElement;
            if (activeElement !== document.getElementById('editor') && 
                activeElement !== document.getElementById('saveFilename')) {
                if (isKeyboardOpen) {
                    isKeyboardOpen = false;
                    onKeyboardClose();
                }
            }
        }, 100);
    }

    function onKeyboardOpen() {
        document.body.classList.add('keyboard-open');
        document.getElementById('keyboardCloseBtn').classList.add('visible');
        document.getElementById('fabContainer').classList.add('keyboard-open');
        
        // Scroll pozisyonunu koru
        const editor = document.getElementById('editor');
        const scrollTop = editor.scrollTop;
        
        // iOS'ta body sabitle
        if (/iPad|iPhone|iPod/.test(navigator.userAgent)) {
            document.body.style.position = 'fixed';
            document.body.style.width = '100%';
            document.body.style.height = '100%';
            document.body.style.top = `-${scrollTop}px`;
        }
    }

    function onKeyboardClose() {
        document.body.classList.remove('keyboard-open');
        document.getElementById('keyboardCloseBtn').classList.remove('visible');
        document.getElementById('fabContainer').classList.remove('keyboard-open');
        
        // iOS sabitlemesini kaldır
        if (/iPad|iPhone|iPod/.test(navigator.userAgent)) {
            const scrollTop = Math.abs(parseInt(document.body.style.top || '0'));
            document.body.style.position = '';
            document.body.style.width = '';
            document.body.style.height = '';
            document.body.style.top = '';
            window.scrollTo(0, scrollTop);
        }
    }

    function closeKeyboard() {
        const editor = document.getElementById('editor');
        const saveInput = document.getElementById('saveFilename');
        
        // Aktif elementi blur et
        if (document.activeElement === editor || document.activeElement === saveInput) {
            document.activeElement.blur();
        }
        
        // iOS'ta klavyeyi kapatmak için extra önlem
        if (/iPad|iPhone|iPod/.test(navigator.userAgent)) {
            // Gizli bir input'a focus olup hemen blur olmak iOS'ta işe yarar
            const tempInput = document.createElement('input');
            tempInput.style.position = 'absolute';
            tempInput.style.opacity = '0';
            tempInput.style.pointerEvents = 'none';
            document.body.appendChild(tempInput);
            tempInput.focus();
            setTimeout(() => {
                tempInput.blur();
                document.body.removeChild(tempInput);
            }, 0);
        }
        
        isKeyboardOpen = false;
        onKeyboardClose();
    }

    // FAB Functions
    function toggleFabMenu() {
        isFabOpen = !isFabOpen;
        const fabMain = document.getElementById('fabMain');
        const fabMenu = document.getElementById('fabMenu');
        const fabOverlay = document.getElementById('fabOverlay');
        
        if (isFabOpen) {
            fabMain.classList.add('active');
            fabMenu.classList.add('open');
            fabOverlay.classList.add('open');
        } else {
            fabMain.classList.remove('active');
            fabMenu.classList.remove('open');
            fabOverlay.classList.remove('open');
        }
    }

    function scrollToTop() {
        const editor = document.getElementById('editor');
        editor.scrollTo({ top: 0, behavior: 'smooth' });
        toggleFabMenu();
        showToast('Yukarı çıkıldı');
    }

    // Storage Functions
    function saveToStorage() {
        localStorage.setItem('mobilKodEditor', JSON.stringify({
            code, filename: loadedFilename, timestamp: new Date().toISOString()
        }));
    }

    function loadFromStorage() {
        try {
            const saved = localStorage.getItem('mobilKodEditor');
            if (saved) {
                const data = JSON.parse(saved);
                if (data.code     !== undefined) code           = data.code;
                if (data.filename !== undefined) loadedFilename = data.filename;
            }
        } catch (e) { console.error('Storage hatası:', e); }
    }

    function generateDefaultFilename() {
        const d = new Date();
        const pad = n => n.toString().padStart(2, '0');
        return `dosya-${pad(d.getDate())}.${pad(d.getMonth()+1)}.${d.getFullYear()}-${pad(d.getHours())}.${pad(d.getMinutes())}`;
    }

    function updateFilenameDisplay() {
        const el = document.getElementById('editorTitle');
        if (loadedFilename && loadedFilename.trim()) {
            el.textContent = loadedFilename + '.html';
            el.classList.add('loaded');
        } else {
            el.textContent = 'Yeni Dosya';
            el.classList.remove('loaded');
        }
    }

    function updateCode() {
        code = document.getElementById('editor').value;
        saveToStorage();
    }

    function updateEditor() {
        document.getElementById('editor').value = code;
    }

    function handleKeydown(e) {
        if (e.key === 'Tab') {
            e.preventDefault();
            const el = e.target, s = el.selectionStart;
            el.value = el.value.substring(0, s) + '  ' + el.value.substring(el.selectionEnd);
            el.selectionStart = el.selectionEnd = s + 2;
            updateCode();
        }
    }

    function toggleRunMenu() {
        document.getElementById('runMenu').classList.toggle('open');
    }

    function runCode(mode) {
        document.getElementById('runMenu').classList.remove('open');
        const full = `<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body>
    ${code}
</body>
</html>`;
        if (mode === 'newtab') {
            window.open(URL.createObjectURL(new Blob([full], {type:'text/html'})), '_blank');
            showToast('Yeni sekmede açıldı');
        } else {
            document.getElementById('previewFrame').srcdoc = full;
            document.getElementById('previewModal').classList.add('open');
        }
    }

    function closePreview() {
        document.getElementById('previewModal').classList.remove('open');
    }

    function openSaveModal() {
        const input = document.getElementById('saveFilename');
        input.value = loadedFilename && loadedFilename.trim() ? loadedFilename : generateDefaultFilename();
        document.getElementById('saveModalOverlay').classList.add('open');
        setTimeout(() => { input.focus(); input.select(); }, 100);
    }

    function closeSaveModal() {
        document.getElementById('saveModalOverlay').classList.remove('open');
        // Klavye açıksa kapat
        if (isKeyboardOpen) {
            closeKeyboard();
        }
    }

    function handleOverlayClick(e) {
        if (e.target.id === 'saveModalOverlay') closeSaveModal();
    }

    function confirmSaveFromModal() {
        let filename = document.getElementById('saveFilename').value.trim();
        if (!filename) {
            showToast('Lütfen bir dosya adı girin');
            const input = document.getElementById('saveFilename');
            input.focus();
            ['-5px','5px','-5px','0'].forEach((x, i) =>
                setTimeout(() => input.style.transform = `translateX(${x})`, i * 50));
            return;
        }
        if (!filename.endsWith('.html')) filename += '.html';
        const full = `<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>${filename}</title>
</head>
<body>
${code}
</body>
</html>`;
        const a = document.createElement('a');
        a.href = URL.createObjectURL(new Blob([full], {type:'text/html'}));
        a.download = filename;
        a.click();
        loadedFilename = filename.replace('.html', '');
        saveToStorage();
        updateFilenameDisplay();
        showToast(`${filename} indirildi`);
        closeSaveModal();
    }

    function loadFile() { document.getElementById('fileInput').click(); }

    function handleFileLoad(event) {
        const file = event.target.files[0];
        if (!file) return;
        event.target.value = '';
        loadedFilename = file.name.replace(/\\.[^/.]+$/, '');
        const reader = new FileReader();
        reader.onload  = (e) => { code = e.target.result; saveToStorage(); updateEditor(); updateFilenameDisplay(); showToast(file.name + ' yüklendi'); };
        reader.onerror = () => showToast('Dosya okunamadı');
        reader.readAsText(file);
    }

    function clearCode() {
        if (confirm('Tüm kodları temizlemek istediğinize emin misiniz?')) {
            code = ''; loadedFilename = '';
            saveToStorage(); updateEditor(); updateFilenameDisplay();
            showToast('Kodlar temizlendi');
        }
    }

    // Copy All - Without opening keyboard (using hidden textarea)
    function copyAll() {
        const hiddenArea = document.getElementById('hiddenCopyArea');
        hiddenArea.value = code;
        hiddenArea.select();
        document.execCommand('copy');
        if (isFabOpen) toggleFabMenu();
        showToast('Kopyalandı');
    }

    function pasteCode() {
        navigator.clipboard.readText().then(text => {
            const el = document.getElementById('editor'), s = el.selectionStart;
            el.value = el.value.substring(0, s) + text + el.value.substring(el.selectionEnd);
            el.selectionStart = el.selectionEnd = s + text.length;
            updateCode(); 
            if (isFabOpen) toggleFabMenu(); 
            showToast('Yapıştırıldı');
        }).catch(() => showToast('Yapıştırma başarısız'));
    }

    let toastTimer;
    function showToast(message) {
        const toast = document.getElementById('toast');
        document.getElementById('toastMessage').textContent = message;
        toast.classList.add('open');
        clearTimeout(toastTimer);
        toastTimer = setTimeout(() => toast.classList.remove('open'), 2000);
    }
</script>

</body>
</html>
