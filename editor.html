<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HTML Editör</title>

<style>
    body {
        margin: 0;
        font-family: Arial, sans-serif;
        display: flex;
        flex-direction: column;
        height: 100vh;
    }

    header {
        background: #111;
        color: white;
        padding: 10px;
        text-align: center;
        font-size: 18px;
    }

    .container {
        display: flex;
        flex: 1;
        flex-direction: row;
    }

    textarea {
        width: 50%;
        height: 100%;
        border: none;
        padding: 10px;
        font-family: monospace;
        font-size: 14px;
        resize: none;
        outline: none;
    }

    iframe {
        width: 50%;
        height: 100%;
        border: none;
        background: white;
    }

    .buttons {
        display: flex;
        gap: 10px;
        padding: 10px;
        background: #f0f0f0;
    }

    button {
        flex: 1;
        padding: 10px;
        font-size: 16px;
        border: none;
        background: #007bff;
        color: white;
        border-radius: 5px;
    }

    button:active {
        background: #0056b3;
    }

    /* Mobil uyum */
    @media (max-width: 768px) {
        .container {
            flex-direction: column;
        }

        textarea, iframe {
            width: 100%;
            height: 50%;
        }
    }
</style>
</head>

<body>

<header>HTML Editör</header>

<div class="buttons">
    <button onclick="calistir()">Çalıştır</button>
    <button onclick="kaydet()">Kaydet (HTML)</button>
</div>

<div class="container">
    <textarea id="editor"><!DOCTYPE html>
<html>
<head>
<title>Örnek</title>
</head>
<body>
<h1>Merhaba Dünya</h1>
<p>Buraya HTML yaz...</p>
</body>
</html></textarea>

    <iframe id="preview"></iframe>
</div>

<script>
function calistir() {
    const kod = document.getElementById("editor").value;
    const iframe = document.getElementById("preview");
    iframe.srcdoc = kod;
}

function kaydet() {
    const kod = document.getElementById("editor").value;
    const blob = new Blob([kod], { type: "text/html" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "kodum.html";
    a.click();
}
</script>

</body>
</html>
