    * {
        -webkit-tap-highlight-color: transparent;
        -webkit-touch-callout: none;
    }
    
    html, body {
        height: 100%;
        overflow: hidden;
        position: fixed;
        width: 100%;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }
    
    .editor-font {
        font-family: 'JetBrains Mono', 'Consolas', 'Monaco', monospace;
        font-size: 14px;
        line-height: 1.6;
    }
    
    .editor-container {
        position: relative;
        height: calc(100vh - 140px);
        overflow: hidden;
    }

    /* Scroll wrapper covers full width */
    .code-area {
        position: absolute;
        inset: 0;
        background: #282c34;
        overflow: auto;
        -webkit-overflow-scrolling: touch;
    }

    /* Highlight overlay — sits behind textarea */
    #highlight-overlay {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        min-height: 100%;
        padding: 16px;
        margin: 0;
        pointer-events: none;
        white-space: pre-wrap;
        word-break: break-all;
        overflow-wrap: break-word;
        background: transparent;
        border: none;
        font-family: 'JetBrains Mono', 'Consolas', 'Monaco', monospace;
        font-size: 14px;
        line-height: 1.6;
        tab-size: 2;
        box-sizing: border-box;
        color: transparent; /* text hidden, only hljs spans show */
        z-index: 1;
    }

    /* hljs resets that interfere */
    #highlight-overlay.hljs {
        background: transparent !important;
        padding: 16px !important;
    }

    /* The actual textarea — transparent text, caret visible */
    .code-input {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        min-height: 100%;
        padding: 16px;
        background: transparent;
        color: transparent;
        caret-color: #528bff;
        border: none;
        resize: none;
        outline: none;
        white-space: pre-wrap;
        word-break: break-all;
        overflow-wrap: break-word;
        overflow: hidden; /* no inner scroll; outer .code-area scrolls */
        tab-size: 2;
        font-family: 'JetBrains Mono', 'Consolas', 'Monaco', monospace;
        font-size: 14px;
        line-height: 1.6;
        box-sizing: border-box;
        z-index: 2;
    }
    
    .tab-active {
        background: #3b82f6;
        color: white;
    }
    
    .tab-inactive {
        background: #374151;
        color: #9ca3af;
    }
    
    .btn-primary {
        background: linear-gradient(135deg, #3b82f6 0%, #2563eb 100%);
        box-shadow: 0 4px 6px -1px rgba(59, 130, 246, 0.3);
    }
    
    .btn-danger {
        background: linear-gradient(135deg, #ef4444 0%, #dc2626 100%);
    }
    
    .btn-success {
        background: linear-gradient(135deg, #10b981 0%, #059669 100%);
    }
    
    .glass-panel {
        background: rgba(31, 41, 55, 0.95);
        backdrop-filter: blur(10px);
        -webkit-backdrop-filter: blur(10px);
    }
    
    @keyframes slideDown {
        from { opacity: 0; transform: translateY(-10px); }
        to { opacity: 1; transform: translateY(0); }
    }
    
    @keyframes fadeIn {
        from { opacity: 0; }
        to { opacity: 1; }
    }
    
    .animate-slide-down { animation: slideDown 0.2s ease-out; }
    .animate-fade-in    { animation: fadeIn  0.2s ease-out; }
    
    .custom-scrollbar::-webkit-scrollbar { width: 6px; height: 6px; }
    .custom-scrollbar::-webkit-scrollbar-track  { background: #1e1e1e; }
    .custom-scrollbar::-webkit-scrollbar-thumb  { background: #4b5563; border-radius: 3px; }
    
    .context-menu-overlay {
        position: fixed; inset: 0;
        background: rgba(0,0,0,0.5);
        z-index: 999;
    }
    
    .context-menu {
        position: fixed;
        top: 50%; left: 50%;
        transform: translate(-50%, -50%);
        background: #374151;
        border: 1px solid #4b5563;
        border-radius: 12px;
        padding: 8px 0;
        z-index: 1000;
        box-shadow: 0 25px 50px -12px rgba(0,0,0,0.7);
        min-width: 200px;
    }
    
    .context-menu-item {
        padding: 14px 20px;
        color: #e5e7eb;
        cursor: pointer;
        transition: background 0.2s;
        display: flex; align-items: center; gap: 12px;
        font-size: 16px;
    }
    .context-menu-item:hover   { background: #4b5563; }
    .context-menu-item:active  { background: #3b82f6; }
    
    .run-menu {
        position: absolute; top: 100%; right: 0;
        margin-top: 8px;
        background: #374151;
        border: 1px solid #4b5563;
        border-radius: 8px;
        overflow: hidden;
        box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        min-width: 180px;
        z-index: 50;
    }
    
    .run-menu-item {
        padding: 12px 16px; color: #e5e7eb;
        cursor: pointer; transition: all 0.2s;
        display: flex; align-items: center; gap: 10px;
    }
    .run-menu-item:hover  { background: #4b5563; }
    .run-menu-item:active { background: #3b82f6; }
    
    .modal-input {
        background: #111827;
        border: 2px solid #374151;
        border-radius: 12px;
        padding: 12px 16px;
        color: #fff; font-size: 16px;
        transition: all 0.2s; width: 100%;
    }
    .modal-input:focus {
        outline: none; border-color: #10b981;
        box-shadow: 0 0 0 3px rgba(16, 185, 129, 0.1);
    }
    
    @media (max-width: 640px) {
        .editor-font { font-size: 13px; }
        #highlight-overlay, .code-input { font-size: 13px; }
    }
    
    .hidden { display: none !important; }
</style>

<script>
    let currentTab = 'html';
    let loadedFilename = '';

    const code = {
        html: '<!-- HTML kodunuzu buraya yazın -->\n<div class="container">\n  <h1>Merhaba Dünya!</h1>\n  <p>Mobil editöre hoş geldiniz.</p>\n</div>',
        css:  '/* CSS kodunuzu buraya yazın */\n.container {\n  text-align: center;\n  padding: 20px;\n  font-family: Arial, sans-serif;\n}\n\nh1 {\n  color: #3b82f6;\n}',
        js:   '// JavaScript kodunuzu buraya yazın\nconsole.log("Merhaba Dünya!");\n\ndocument.querySelector("h1").addEventListener("click", function() {\n  alert("Tıklandı!");\n});'
    };

    // Tab → highlight.js language map
    const langMap = { html: 'xml', css: 'css', js: 'javascript' };

    // ── Highlight ──────────────────────────────────────────────────────────
    function refreshHighlight() {
        const raw   = document.getElementById('editor').value;
        const lang  = langMap[currentTab];
        const el    = document.getElementById('highlight-code');

        // Escape HTML entities so hljs doesn't mangle them
        const escaped = raw
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;');

        el.className = `language-${lang}`;
        el.innerHTML = escaped;
        hljs.highlightElement(el);

        // Keep overlay same height as textarea content
        syncOverlaySize();
    }

    function syncOverlaySize() {
        const ta  = document.getElementById('editor');
        const pre = document.getElementById('highlight-overlay');
        // Match scrollWidth so word-wrap behaves identically
        pre.style.width = ta.offsetWidth + 'px';
    }

    // Sync overlay scroll position with textarea scroll
    function syncHighlightScroll() {
        const ta  = document.getElementById('editor');
        const pre = document.getElementById('highlight-overlay');
        pre.scrollTop  = ta.scrollTop;
        pre.scrollLeft = ta.scrollLeft;
    }

    // ── Storage ────────────────────────────────────────────────────────────
    function saveToStorage() {
        localStorage.setItem('mobilKodEditor', JSON.stringify({
            html: code.html, css: code.css, js: code.js,
            filename: loadedFilename,
            timestamp: new Date().toISOString()
        }));
    }

    function loadFromStorage() {
        const saved = localStorage.getItem('mobilKodEditor');
        if (!saved) return;
        try {
            const d = JSON.parse(saved);
            if (d.html !== undefined) code.html = d.html;
            if (d.css  !== undefined) code.css  = d.css;
            if (d.js   !== undefined) code.js   = d.js;
            if (d.filename !== undefined) loadedFilename = d.filename;
        } catch(e) {}
    }

    // ── Core ───────────────────────────────────────────────────────────────
    function updateCode() {
        code[currentTab] = document.getElementById('editor').value;
        refreshHighlight();
        saveToStorage();
    }

    function updateEditor() {
        document.getElementById('editor').value = code[currentTab];
        refreshHighlight();
    }

    function switchTab(tab) {
        code[currentTab] = document.getElementById('editor').value;
        document.getElementById(`tab-${currentTab}`).className =
            'tab-inactive px-4 py-2 rounded-lg text-sm font-medium transition-all whitespace-nowrap flex items-center gap-2';
        currentTab = tab;
        document.getElementById(`tab-${currentTab}`).className =
            'tab-active px-4 py-2 rounded-lg text-sm font-medium transition-all whitespace-nowrap flex items-center gap-2';
        updateEditor();
    }

    function handleKeydown(e) {
        if (e.key === 'Tab') {
            e.preventDefault();
            const ed = e.target, s = ed.selectionStart, en = ed.selectionEnd;
            ed.value = ed.value.substring(0, s) + '  ' + ed.value.substring(en);
            ed.selectionStart = ed.selectionEnd = s + 2;
            updateCode();
        }
    }

    // ── Run ────────────────────────────────────────────────────────────────

    function runCode(mode) {
        document.getElementById('runMenu').classList.add('hidden');
        const full = buildFullCode();
        if (mode === 'newtab') {
            const url = URL.createObjectURL(new Blob([full], {type:'text/html'}));
            window.open(url, '_blank');
            showToast('Yeni sekmede açıldı');
        } else {
            document.getElementById('previewFrame').srcdoc = full;
            document.getElementById('previewModal').classList.remove('hidden');
        }
    }

    function closePreview() {
        document.getElementById('previewModal').classList.add('hidden');
    }

    // ── Save Modal ─────────────────────────────────────────────────────────
    function openSaveModal() {
        const fi = document.getElementById('saveFilename');
        fi.value = loadedFilename ? loadedFilename.replace('.html','') : '';
        const m = document.getElementById('saveModalOverlay');
        m.classList.remove('hidden'); m.classList.add('flex');
        setTimeout(() => fi.focus(), 100);
    }

    function closeSaveModal() {
        const m = document.getElementById('saveModalOverlay');
        m.classList.add('hidden'); m.classList.remove('flex');
    }

    function confirmSaveFromModal() {
        let fn = document.getElementById('saveFilename').value.trim();
        if (!fn) {
            showToast('Lütfen bir dosya adı girin');
            const inp = document.getElementById('saveFilename');
            inp.focus();
            ['-5px','5px','-5px','0'].forEach((v,i) =>
                setTimeout(() => inp.style.transform = `translateX(${v})`, i*50));
            return;
        }
        if (!fn.endsWith('.html')) fn += '.html';
        const blob = new Blob([buildFullCode()], {type:'text/html'});
        const a = Object.assign(document.createElement('a'),
                      {href: URL.createObjectURL(blob), download: fn});
        a.click();
        URL.revokeObjectURL(a.href);
        loadedFilename = fn.replace('.html','');
        saveToStorage();
        showToast(`${fn} indirildi`);
        closeSaveModal();
    }

    // ── Load File ──────────────────────────────────────────────────────────
    function loadFile() { document.getElementById('fileInput').click(); }

    function handleFileLoad(event) {
        const file = event.target.files[0];
        if (!file) return;
        loadedFilename = file.name.replace('.html','');
        const reader = new FileReader();
        reader.onload = e => {
            const c = e.target.result;
            const hm = c.match(/<body>([\s\S]*?)<\/body>/i);
            const cm = c.match(/<style>([\s\S]*?)<\/style>/i);
            const jm = c.match(/<script>([\s\S]*?)<\/script>/i);
            if (hm) code.html = hm[1].trim();
            if (cm) code.css  = cm[1].trim();
            if (jm) code.js   = jm[1].trim();
            saveToStorage();
            updateEditor();
            showToast(`${file.name} yüklendi`);
        };
        reader.readAsText(file);
    }

    // ── Clear ──────────────────────────────────────────────────────────────
    function clearCode() {
        if (!confirm('Tüm kodları temizlemek istediğinize emin misiniz?')) return;
        code.html = code.css = code.js = '';
        loadedFilename = '';
        saveToStorage();
        updateEditor();
        showToast('Kodlar temizlendi');
    }

    // ── Context Menu ───────────────────────────────────────────────────────
    function showContextMenu(e) {
        e.preventDefault();
        document.getElementById('contextMenuOverlay').classList.remove('hidden');
        document.getElementById('contextMenu').classList.remove('hidden');
    }
    function hideContextMenu() {
        document.getElementById('contextMenuOverlay').classList.add('hidden');
        document.getElementById('contextMenu').classList.add('hidden');
    }
    function copyAll() {
        document.getElementById('editor').select();
        document.execCommand('copy');
        hideContextMenu(); showToast('Kopyalandı');
    }
    function pasteCode() {
        navigator.clipboard.readText().then(t => {
            const ed = document.getElementById('editor'), s = ed.selectionStart;
            ed.value = ed.value.substring(0,s) + t + ed.value.substring(ed.selectionEnd);
            ed.selectionStart = ed.selectionEnd = s + t.length;
            updateCode(); hideContextMenu(); showToast('Yapıştırıldı');
        }).catch(() => showToast('Yapıştırma başarısız'));
    }
    function selectAll() {
        document.getElementById('editor').select();
        hideContextMenu();
    }

    // ── Toast ──────────────────────────────────────────────────────────────
    function showToast(msg) {
        const t = document.getElementById('toast');
        document.getElementById('toastMessage').textContent = msg;
        t.classList.remove('hidden'); t.classList.add('flex');
        setTimeout(() => { t.classList.add('hidden'); t.classList.remove('flex'); }, 2000);
    }

    // ── Resize ─────────────────────────────────────────────────────────────
    let initialHeight = window.innerHeight;
    function handleResize() {
        const h = window.innerHeight;
        document.getElementById('editorContainer').style.height =
            (initialHeight - h > 100) ? (h - 140) + 'px' : 'calc(100vh - 140px)';
        syncOverlaySize();
    }

    // ── Init ───────────────────────────────────────────────────────────────
    document.addEventListener('DOMContentLoaded', () => {
        loadFromStorage();
        updateEditor();

        // Close run menu on outside click
        document.addEventListener('click', e => {
            if (!e.target.closest('.relative'))
                document.getElementById('runMenu').classList.add('hidden');
        });

        // Long-press context menu on mobile
        let pressTimer;
        const ed = document.getElementById('editor');
        ed.addEventListener('touchstart',  e => { pressTimer = setTimeout(() => showContextMenu(e), 800); });
        ed.addEventListener('touchend',    ()  => clearTimeout(pressTimer));
        ed.addEventListener('touchmove',   ()  => clearTimeout(pressTimer));

        window.addEventListener('resize', handleResize);
        window.addEventListener('beforeunload', saveToStorage);

        document.getElementById('saveModalOverlay').addEventListener('click', e => {
            if (e.target.id === 'saveModalOverlay') closeSaveModal();
        });
    });
</script>
