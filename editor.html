<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Native Code Editor</title>
    <style>
        :root {
            --bg: #1e1e1e; --text: #d4d4d4; --accent: #007acc;
            --html-tag: #569cd6; --attr: #9cdcfe; --val: #ce9178; --comment: #6a9955;
        }

        * { box-sizing: border-box; }
        body { 
            margin: 0; font-family: 'Courier New', monospace; 
            background: var(--bg); color: var(--text); height: 100dvh; 
            display: flex; flex-direction: column; overflow: hidden;
        }

        /* Toolbar */
        .toolbar {
            display: flex; gap: 8px; padding: 10px; background: #252526;
            border-bottom: 1px solid #333; align-items: center;
        }
        #fileNameInput {
            flex: 1; background: #3c3c3c; border: 1px solid #555;
            color: white; padding: 6px 12px; border-radius: 4px; outline: none;
        }
        .btn {
            background: #333; border: 1px solid #555; color: white;
            padding: 6px 10px; border-radius: 4px; cursor: pointer; font-size: 12px;
        }
        .btn-run { background: var(--accent); border: none; font-weight: bold; }

        /* Tabs */
        .tabs { display: flex; background: #2d2d2d; }
        .tab {
            padding: 10px 20px; cursor: pointer; font-size: 13px;
            border-bottom: 2px solid transparent; opacity: 0.6;
        }
        .tab.active { opacity: 1; border-bottom-color: var(--accent); background: var(--bg); }

        /* Editor Area */
        .editor-container {
            flex: 1; position: relative; overflow: hidden;
        }
        
        /* Satır Numaraları */
        .line-numbers {
            position: absolute; left: 0; top: 0; bottom: 0; width: 40px;
            background: #1e1e1e; color: #858585; text-align: right;
            padding: 15px 5px; font-size: 14px; line-height: 20px;
            user-select: none; border-right: 1px solid #333; z-index: 5;
        }

        /* Katmanlı Yazım Alanı */
        #input-area, #highlight-area {
            position: absolute; inset: 0 0 0 45px; /* Numaralar için soldan boşluk */
            padding: 15px 10px; margin: 0; border: none;
            font-family: inherit; font-size: 14px; line-height: 20px;
            white-space: pre; word-wrap: normal; overflow: auto;
        }

        #input-area {
            background: transparent; color: transparent; caret-color: white;
            resize: none; outline: none; z-index: 2;
        }

        #highlight-area {
            pointer-events: none; z-index: 1; white-space: pre-wrap;
        }

        /* Renklendirme Syntax */
        .token-tag { color: var(--html-tag); }
        .token-attr { color: var(--attr); }
        .token-string { color: var(--val); }
        .token-comment { color: var(--comment); }

        /* Modal */
        #modal {
            display: none; position: fixed; inset: 0; background: white; z-index: 100;
            flex-direction: column;
        }
        .modal-header { background: #333; padding: 10px; display: flex; justify-content: space-between; }
    </style>
</head>
<body>

<div class="toolbar">
    <input type="text" id="fileNameInput" placeholder="dosya_adi">
    <button class="btn" onclick="triggerLoad()">Yükle</button>
    <button class="btn" onclick="saveFile()">Kaydet</button>
    <button class="btn" onclick="clearAll()">Temizle</button>
    <button class="btn btn-run" onclick="runCode()">Çalıştır</button>
    <input type="file" id="fileInp" hidden onchange="processFile(this)">
</div>

<div class="tabs">
    <div class="tab active" onclick="switchTab('html', this)">HTML</div>
    <div class="tab" onclick="switchTab('css', this)">CSS</div>
    <div class="tab" onclick="switchTab('js', this)">JS</div>
</div>

<div class="editor-container">
    <div class="line-numbers" id="lineNumbers">1</div>
    <textarea id="input-area" spellcheck="false" oninput="updateEditor()" onscroll="syncScroll()"></textarea>
    <pre id="highlight-area"><code id="code-content"></code></pre>
</div>

<div id="modal">
    <div class="modal-header">
        <span style="color:white">Önizleme</span>
        <button onclick="closeModal()" style="background:red; color:white; border:none; padding:5px 10px;">Kapat</button>
    </div>
    <iframe id="preview" style="flex:1; border:none;"></iframe>
</div>

<script>
    let currentMode = 'html';
    const codes = {
        html: '\n<h1 class="baslik">Kod Editörü</h1>\n<p>Buraya yazabilirsin.</p>',
        css: 'body {\n  background: #222;\n  color: gold;\n}',
        js: 'console.log("Sistem çalışıyor...");'
    };

    const inputArea = document.getElementById('input-area');
    const codeContent = document.getElementById('code-content');
    const lineNumbers = document.getElementById('lineNumbers');

    // Başlangıç
    inputArea.value = codes.html;
    updateEditor();

    function updateEditor() {
        let text = inputArea.value;
        codes[currentMode] = text;

        // Basit Syntax Highlighting (Regex ile)
        if (currentMode === 'html') {
            text = text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
            text = text.replace(/&lt;!--([\s\S]*?)--&gt;/g, '<span class="token-comment">&lt;!--$1--&gt;</span>');
            text = text.replace(/(&lt;\/?[a-z1-6]+)/gi, '<span class="token-tag">$1</span>');
            text = text.replace(/([a-z-]+)(?==)/gi, '<span class="token-attr">$1</span>');
            text = text.replace(/"(.*?)"/g, '<span class="token-string">"$1"</span>');
        } else {
            // CSS ve JS için çok temel renklendirme
            text = text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
            text = text.replace(/\/\*([\s\S]*?)\*\//g, '<span class="token-comment">/*$1*/</span>');
        }

        codeContent.innerHTML = text + "\n"; // Sona boşluk ekle ki kaydırma düzgün olsun
        updateLineNumbers();
    }

    function updateLineNumbers() {
        const lines = inputArea.value.split('\n').length;
        lineNumbers.innerHTML = Array.from({length: lines}, (_, i) => i + 1).join('<br>');
    }

    function syncScroll() {
        const highlight = document.getElementById('highlight-area');
        highlight.scrollTop = inputArea.scrollTop;
        highlight.scrollLeft = inputArea.scrollLeft;
        lineNumbers.scrollTop = inputArea.scrollTop;
    }

    function switchTab(mode, el) {
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        el.classList.add('active');
        currentMode = mode;
        inputArea.value = codes[mode];
        updateEditor();
    }

    function runCode() {
        const combined = `<html><style>${codes.css}</style><body>${codes.html}<script>${codes.js}<\/script></body></html>`;
        const blob = new Blob([combined], {type: 'text/html'});
        const url = URL.createObjectURL(blob);
        
        if(confirm("Yeni sekmede açmak için TAMAM'a, burada görmek için İPTAL'e bas.")) {
            window.open(url);
        } else {
            document.getElementById('preview').src = url;
            document.getElementById('modal').style.display = 'flex';
        }
    }

    function saveFile() {
        const name = (document.getElementById('fileNameInput').value || 'deneme') + ".html";
        const combined = `<html><style>${codes.css}</style><body>${codes.html}<script>${codes.js}<\/script></body></html>`;
        const a = document.createElement('a');
        a.href = URL.createObjectURL(new Blob([combined], {type: 'text/html'}));
        a.download = name;
        a.click();
    }

    function clearAll() { if(confirm("Temizle?")) { inputArea.value = ""; updateEditor(); } }
    function triggerLoad() { document.getElementById('fileInp').click(); }
    function processFile(inp) {
        const reader = new FileReader();
        reader.onload = () => { inputArea.value = reader.result; updateEditor(); };
        reader.readAsText(inp.files[0]);
    }
    function closeModal() { document.getElementById('modal').style.display = 'none'; }

    // Uzun basınca tümünü kopyala
    inputArea.addEventListener('contextmenu', (e) => {
        e.preventDefault();
        inputArea.select();
        document.execCommand('copy');
        alert("Tüm kod kopyalandı!");
    });
</script>

</body>
</html>
