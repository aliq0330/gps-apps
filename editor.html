<!DOCTYPE html>

<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Kod Editörü - Pure Liquid Glass</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Inter:wght@400;500;600;700&display=swap');


*, *::before, *::after {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
    -webkit-touch-callout: none;
    margin: 0; padding: 0;
}

:root {
    color-scheme: light dark;
    --glass-bg: rgba(255, 255, 255, 0.25);
    --glass-border: rgba(255, 255, 255, 0.4);
    --glass-highlight: rgba(255, 255, 255, 0.6);
    --glass-shadow:
        0 2px 4px rgba(0,0,0,0.02),
        0 8px 16px rgba(0,0,0,0.04),
        0 16px 32px rgba(0,0,0,0.06);
    --text-primary: #1c1c1e;
    --text-secondary: rgba(60,60,67,0.6);
    --accent: #8e8e93;
    --blur: 24px;
    --saturation: 200%;
    --transition: all 0.4s cubic-bezier(0.25,0.8,0.25,1);
    --glass-reflex-light: 1;
    --glass-reflex-dark: 1;
}

@media (prefers-color-scheme: dark) {
    :root {
        --glass-bg: rgba(28,28,30,0.4);
        --glass-border: rgba(255,255,255,0.1);
        --glass-highlight: rgba(255,255,255,0.15);
        --glass-shadow:
            0 2px 4px rgba(0,0,0,0.2),
            0 8px 16px rgba(0,0,0,0.3),
            0 16px 32px rgba(0,0,0,0.4);
        --text-primary: #ffffff;
        --text-secondary: rgba(235,235,245,0.6);
        --glass-reflex-light: 0.3;
        --glass-reflex-dark: 2;
    }
}

html, body {
    height: 100%;
    font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Inter', sans-serif;
    background:
        radial-gradient(ellipse at top left, rgba(120,120,128,0.15) 0%, transparent 50%),
        radial-gradient(ellipse at bottom right, rgba(120,120,128,0.1) 0%, transparent 50%),
        radial-gradient(ellipse at center, rgba(255,255,255,0.8) 0%, rgba(242,242,247,1) 100%);
    color: var(--text-primary);
    overflow: hidden;
    display: flex;
    flex-direction: column;
}

@media (prefers-color-scheme: dark) {
    html, body {
        background:
            radial-gradient(ellipse at top left, rgba(120,120,128,0.2) 0%, transparent 50%),
            radial-gradient(ellipse at bottom right, rgba(120,120,128,0.15) 0%, transparent 50%),
            #000000;
    }
}

body.keyboard-open { position: fixed; width: 100%; height: 100%; overflow: hidden; }
svg { display: block; flex-shrink: 0; }

/* ── Header ── */
.header {
    background: var(--glass-bg);
    backdrop-filter: saturate(var(--saturation)) blur(var(--blur));
    -webkit-backdrop-filter: saturate(var(--saturation)) blur(var(--blur));
    border-bottom: 1px solid var(--glass-border);
    padding: 16px 20px;
    flex-shrink: 0; z-index: 40;
    transition: var(--transition);
}

.header-top {
    display: flex; align-items: center;
    justify-content: space-between; gap: 16px;
}

.header-bottom {
    display: flex; align-items: center;
    justify-content: space-between; gap: 16px;
    margin-top: 16px; padding-top: 16px;
    border-top: 1px solid var(--glass-border);
}

.tab {
    display: inline-flex; align-items: center; gap: 8px;
    padding: 8px 16px; border-radius: 20px;
    font-size: 13px; font-weight: 600; letter-spacing: -0.01em;
    cursor: default; white-space: nowrap; font-family: inherit;
    background-color: color-mix(in srgb, var(--glass-bg) 80%, transparent);
    backdrop-filter: saturate(var(--saturation)) blur(var(--blur));
    border: none;
    color: var(--text-primary);
    box-shadow:
        inset 0 0 0 1px color-mix(in srgb, white calc(var(--glass-reflex-light) * 10%), transparent),
        inset 1.8px 3px 0px -2px color-mix(in srgb, white calc(var(--glass-reflex-light) * 90%), transparent),
        inset -2px -2px 0px -2px color-mix(in srgb, white calc(var(--glass-reflex-light) * 80%), transparent),
        inset -0.3px -1px 4px 0px color-mix(in srgb, black calc(var(--glass-reflex-dark) * 12%), transparent),
        0px 1px 5px 0px color-mix(in srgb, black calc(var(--glass-reflex-dark) * 10%), transparent),
        0px 6px 16px 0px color-mix(in srgb, black calc(var(--glass-reflex-dark) * 8%), transparent);
    transition: var(--transition);
}

.tab-dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: #ff453a; flex-shrink: 0;
    box-shadow: 0 0 6px rgba(255,69,58,0.6);
}

/* ── Buttons ── */
.btn {
    display: inline-flex; align-items: center;
    justify-content: center; gap: 6px;
    cursor: pointer;
    font-family: inherit; font-weight: 600;
    font-size: 15px; letter-spacing: -0.01em;
    border-radius: 22px; transition: var(--transition);
    white-space: nowrap;
    padding: 12px 20px; min-width: 100px; height: 44px;
    background-color: color-mix(in srgb, var(--glass-bg) 80%, transparent);
    backdrop-filter: blur(var(--blur)) saturate(var(--saturation));
    -webkit-backdrop-filter: blur(var(--blur)) saturate(var(--saturation));
    border: none;
    color: var(--text-primary);
    position: relative; overflow: hidden;
    box-shadow:
        inset 0 0 0 1px color-mix(in srgb, white calc(var(--glass-reflex-light) * 10%), transparent),
        inset 1.8px 3px 0px -2px color-mix(in srgb, white calc(var(--glass-reflex-light) * 90%), transparent),
        inset -2px -2px 0px -2px color-mix(in srgb, white calc(var(--glass-reflex-light) * 80%), transparent),
        inset -0.3px -1px 4px 0px color-mix(in srgb, black calc(var(--glass-reflex-dark) * 12%), transparent),
        0px 1px 5px 0px color-mix(in srgb, black calc(var(--glass-reflex-dark) * 10%), transparent),
        0px 6px 16px 0px color-mix(in srgb, black calc(var(--glass-reflex-dark) * 8%), transparent);
}

.btn:hover {
    background-color: color-mix(in srgb, var(--glass-bg) 95%, white);
    transform: translateY(-1px);
    box-shadow:
        inset 0 0 0 1px color-mix(in srgb, white calc(var(--glass-reflex-light) * 14%), transparent),
        inset 1.8px 3px 0px -2px color-mix(in srgb, white calc(var(--glass-reflex-light) * 100%), transparent),
        inset -2px -2px 0px -2px color-mix(in srgb, white calc(var(--glass-reflex-light) * 90%), transparent),
        inset -0.3px -1px 4px 0px color-mix(in srgb, black calc(var(--glass-reflex-dark) * 10%), transparent),
        0px 4px 10px 0px color-mix(in srgb, black calc(var(--glass-reflex-dark) * 14%), transparent),
        0px 10px 28px 0px color-mix(in srgb, black calc(var(--glass-reflex-dark) * 12%), transparent);
}

.btn:active {
    transform: scale(0.94);
    box-shadow:
        inset 0 0 0 1px color-mix(in srgb, white calc(var(--glass-reflex-light) * 8%), transparent),
        inset 1px 2px 4px 0px color-mix(in srgb, black calc(var(--glass-reflex-dark) * 18%), transparent),
        0px 1px 3px 0px color-mix(in srgb, black calc(var(--glass-reflex-dark) * 8%), transparent);
}

.btn-sm {
    padding: 10px 16px; min-width: 88px;
    height: 40px; font-size: 14px; border-radius: 20px;
}

.actions { display: flex; align-items: center; gap: 10px; flex-shrink: 0; }
.file-info { display: flex; align-items: center; flex: 1; min-width: 0; overflow: hidden; }

.editor-title {
    color: var(--text-secondary); font-size: 13px;
    font-family: 'JetBrains Mono', monospace;
    overflow: hidden; text-overflow: ellipsis;
    white-space: nowrap; font-weight: 500;
}
.editor-title.loaded { color: var(--text-primary); font-weight: 600; }

/* ══════════════════════════════════════
   LIQUID GLASS SWITCHER (Kod / Önizle)
   ══════════════════════════════════════ */
.view-switcher {
    position: relative;
    display: flex;
    align-items: center;
    gap: 0;
    width: 108px;
    height: 44px;
    box-sizing: border-box;
    padding: 5px 6px;
    border: none;
    border-radius: 99em;
    background-color: color-mix(in srgb, var(--glass-bg) 80%, transparent);
    backdrop-filter: blur(var(--blur)) saturate(var(--saturation));
    -webkit-backdrop-filter: blur(var(--blur)) saturate(var(--saturation));
    box-shadow:
        inset 0 0 0 1px color-mix(in srgb, white calc(var(--glass-reflex-light) * 10%), transparent),
        inset 1.8px 3px 0px -2px color-mix(in srgb, white calc(var(--glass-reflex-light) * 90%), transparent),
        inset -2px -2px 0px -2px color-mix(in srgb, white calc(var(--glass-reflex-light) * 80%), transparent),
        inset -0.3px -1px 4px 0px color-mix(in srgb, black calc(var(--glass-reflex-dark) * 12%), transparent),
        0px 1px 5px 0px color-mix(in srgb, black calc(var(--glass-reflex-dark) * 10%), transparent),
        0px 6px 16px 0px color-mix(in srgb, black calc(var(--glass-reflex-dark) * 8%), transparent);
    transition: background-color 400ms cubic-bezier(1,0,0.4,1),
                box-shadow 400ms cubic-bezier(1,0,0.4,1);
}

.view-switcher__legend {
    position: absolute; width: 1px; height: 1px;
    margin: -1px; border: 0; padding: 0;
    white-space: nowrap; clip-path: inset(100%);
    clip: rect(0 0 0 0); overflow: hidden;
}

.view-switcher__input {
    clip: rect(0 0 0 0); clip-path: inset(100%);
    height: 1px; width: 1px; overflow: hidden;
    position: absolute; white-space: nowrap;
}

.view-switcher__filter {
    position: absolute; width: 0; height: 0; z-index: -1;
}

.view-switcher__option {
    --c: var(--text-secondary);
    display: flex; justify-content: center; align-items: center;
    padding: 0 12px;
    width: 48px; height: 100%;
    box-sizing: border-box;
    border-radius: 99em;
    transition: all 160ms;
    cursor: pointer;
    position: relative; z-index: 1;
}

.view-switcher__option:hover { --c: var(--text-primary); }
.view-switcher__option:hover .view-switcher__icon { scale: 1.2; }
.view-switcher__option:has(input:checked) { --c: var(--text-primary); cursor: auto; }
.view-switcher__option:has(input:checked) .view-switcher__icon { scale: 1; }

.view-switcher__icon {
    display: block; width: 20px; height: 20px;
    fill: none; stroke: var(--c);
    stroke-width: 2; stroke-linecap: round; stroke-linejoin: round;
    transition: scale 200ms cubic-bezier(0.5,0,0,1), stroke 200ms;
}

/* Moving toggle pill */
.view-switcher::after {
    content: "";
    position: absolute;
    left: 4px; top: 4px;
    display: block;
    width: 48px;
    height: calc(100% - 8px);
    border-radius: 99em;
    background-color: color-mix(in srgb, white calc(var(--glass-reflex-light) * 36%), transparent);
    z-index: 0;
    box-shadow:
        inset 0 0 0 1px color-mix(in srgb, white calc(var(--glass-reflex-light) * 10%), transparent),
        inset 2px 1px 0px -1px color-mix(in srgb, white calc(var(--glass-reflex-light) * 90%), transparent),
        inset -1.5px -1px 0px -1px color-mix(in srgb, white calc(var(--glass-reflex-light) * 80%), transparent),
        inset -1px 2px 3px -1px color-mix(in srgb, black calc(var(--glass-reflex-dark) * 20%), transparent),
        0px 3px 6px 0px color-mix(in srgb, black calc(var(--glass-reflex-dark) * 8%), transparent);
    transition:
        background-color 400ms cubic-bezier(1,0,0.4,1),
        box-shadow 400ms cubic-bezier(1,0,0.4,1),
        translate 400ms cubic-bezier(1,0,0.4,1);
}

/* Kod seçili */
.view-switcher:has(input[c-option="1"]:checked)::after {
    translate: 0 0;
    transform-origin: right;
    animation: swScale 440ms ease;
}

/* Önizle seçili */
.view-switcher:has(input[c-option="2"]:checked)::after {
    translate: 52px 0;
    transform-origin: left;
    animation: swScale 440ms ease;
}

@keyframes swScale {
    0%   { scale: 1 1; }
    50%  { scale: 1.18 1; }
    100% { scale: 1 1; }
}

/* ── Main area ── */
main {
    flex: 1; min-height: 0;
    display: flex; flex-direction: column;
    position: relative;
}

.code-area {
    background: transparent; width: 100%;
    flex: 1; min-height: 0;
    position: relative; display: flex; flex-direction: column;
}

.code-input {
    width: 100%; height: 100%;
    padding: 20px; padding-bottom: 100px;
    background: transparent; color: var(--text-primary);
    border: none; resize: none; outline: none;
    white-space: pre-wrap; word-wrap: break-word;
    overflow-x: hidden; overflow-y: auto;
    tab-size: 2; caret-color: var(--accent);
    font-family: 'JetBrains Mono', 'SF Mono', monospace;
    font-size: 15px; line-height: 1.6; letter-spacing: -0.01em;
    flex: 1;
}

.code-input::-webkit-scrollbar { width: 8px; }
.code-input::-webkit-scrollbar-track { background: transparent; }
.code-input::-webkit-scrollbar-thumb { background: var(--glass-border); border-radius: 4px; }

/* ── Inline Preview ── */
.preview-area {
    display: none; flex: 1; min-height: 0;
    flex-direction: column;
}
.preview-area.active { display: flex; }

.preview-frame-inline {
    flex: 1; width: 100%; border: none; background: white;
}

.hidden-copy-area {
    position: absolute; left: -9999px; top: -9999px;
    opacity: 0; pointer-events: none;
}

/* ── FAB ── */
.fab-container {
    position: fixed; bottom: 28px; right: 28px; z-index: 100;
    transition: bottom 0.4s cubic-bezier(0.25,0.8,0.25,1), opacity 0.3s ease, transform 0.3s ease;
}
.fab-container.keyboard-open { bottom: 100px; }

.fab-main {
    width: 60px; height: 60px; border-radius: 50%;
    background-color: color-mix(in srgb, var(--glass-bg) 80%, transparent);
    backdrop-filter: saturate(var(--saturation)) blur(var(--blur));
    -webkit-backdrop-filter: saturate(var(--saturation)) blur(var(--blur));
    border: none; color: var(--text-primary);
    cursor: pointer; display: flex; align-items: center;
    justify-content: center;
    box-shadow:
        inset 0 0 0 1px color-mix(in srgb, white calc(var(--glass-reflex-light) * 10%), transparent),
        inset 1.8px 3px 0px -2px color-mix(in srgb, white calc(var(--glass-reflex-light) * 90%), transparent),
        inset -2px -2px 0px -2px color-mix(in srgb, white calc(var(--glass-reflex-light) * 80%), transparent),
        inset -0.3px -1px 4px 0px color-mix(in srgb, black calc(var(--glass-reflex-dark) * 12%), transparent),
        0px 1px 5px 0px color-mix(in srgb, black calc(var(--glass-reflex-dark) * 10%), transparent),
        0px 6px 16px 0px color-mix(in srgb, black calc(var(--glass-reflex-dark) * 8%), transparent);
    transition: var(--transition); position: relative; z-index: 102;
}
.fab-main:hover { transform: scale(1.08); background-color: color-mix(in srgb, var(--glass-bg) 95%, white); }
.fab-main:active { transform: scale(0.88); }
.fab-main.active { transform: rotate(45deg) scale(0.92); }
.fab-icon { color: var(--text-primary); transition: transform 0.3s ease; }

.fab-overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,0.15);
    backdrop-filter: blur(8px); z-index: 99;
    display: none; opacity: 0; transition: opacity 0.3s ease;
}
.fab-overlay.open { display: block; opacity: 1; }

.fab-menu {
    position: absolute; bottom: 76px; right: 0;
    display: flex; flex-direction: column; align-items: flex-end; gap: 12px;
    opacity: 0; transform: translateY(20px) scale(0.9);
    pointer-events: none;
    transition: all 0.4s cubic-bezier(0.25,0.8,0.25,1);
    transform-origin: bottom right;
}
.fab-menu.open { opacity: 1; transform: translateY(0) scale(1); pointer-events: all; }

.fab-menu-item {
    display: flex; align-items: center; gap: 12px;
    background-color: color-mix(in srgb, var(--glass-bg) 80%, transparent);
    backdrop-filter: saturate(var(--saturation)) blur(var(--blur));
    -webkit-backdrop-filter: saturate(var(--saturation)) blur(var(--blur));
    border: none; border-radius: 24px;
    padding: 14px 22px; color: var(--text-primary);
    cursor: pointer;
    box-shadow:
        inset 0 0 0 1px color-mix(in srgb, white calc(var(--glass-reflex-light) * 10%), transparent),
        inset 1.8px 3px 0px -2px color-mix(in srgb, white calc(var(--glass-reflex-light) * 90%), transparent),
        inset -2px -2px 0px -2px color-mix(in srgb, white calc(var(--glass-reflex-light) * 80%), transparent),
        inset -0.3px -1px 4px 0px color-mix(in srgb, black calc(var(--glass-reflex-dark) * 12%), transparent),
        0px 1px 5px 0px color-mix(in srgb, black calc(var(--glass-reflex-dark) * 10%), transparent),
        0px 6px 16px 0px color-mix(in srgb, black calc(var(--glass-reflex-dark) * 8%), transparent);
    transition: var(--transition); white-space: nowrap;
    transform: translateX(20px); opacity: 0;
    font-weight: 600; font-size: 15px; height: 48px;
}
.fab-menu.open .fab-menu-item { transform: translateX(0); opacity: 1; }
.fab-menu.open .fab-menu-item:nth-child(1) { transition-delay: 0.06s; }
.fab-menu.open .fab-menu-item:nth-child(2) { transition-delay: 0.12s; }
.fab-menu.open .fab-menu-item:nth-child(3) { transition-delay: 0.18s; }
.fab-menu-item:hover { transform: scale(1.05); background-color: color-mix(in srgb, var(--glass-bg) 95%, white); }
.fab-menu-item:active { transform: scale(0.95); }
.fab-menu-icon { width: 20px; height: 20px; display: flex; align-items: center; justify-content: center; color: var(--text-primary); }

/* ── Keyboard Close ── */
.keyboard-close-btn {
    position: fixed; bottom: 0; left: 0; right: 0;
    background: var(--glass-bg);
    backdrop-filter: saturate(var(--saturation)) blur(var(--blur));
    -webkit-backdrop-filter: saturate(var(--saturation)) blur(var(--blur));
    border-top: 1px solid var(--glass-border);
    padding: 16px 24px; display: none;
    align-items: center; justify-content: center; gap: 8px;
    z-index: 1000; height: 64px;
}
.keyboard-close-btn.visible { display: flex; }
.keyboard-close-btn:active { background: var(--glass-highlight); }
.keyboard-close-icon { color: var(--text-primary); width: 20px; height: 20px; }
.keyboard-close-text { color: var(--text-primary); font-size: 15px; font-weight: 600; letter-spacing: -0.01em; }

/* ── Save Modal ── */
.modal-overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,0.25);
    backdrop-filter: blur(20px); z-index: 50;
    display: none; align-items: center; justify-content: center;
    opacity: 0; transition: opacity 0.3s ease;
}
.modal-overlay.open { display: flex; opacity: 1; animation: fadeIn 0.3s ease; }

.modal-box {
    background: var(--glass-bg);
    backdrop-filter: saturate(var(--saturation)) blur(var(--blur));
    -webkit-backdrop-filter: saturate(var(--saturation)) blur(var(--blur));
    border: 1px solid var(--glass-border); border-radius: 32px; padding: 32px;
    width: 88%; max-width: 380px;
    box-shadow: 0 8px 16px rgba(0,0,0,0.08), 0 32px 64px rgba(0,0,0,0.12);
    animation: glassScale 0.4s cubic-bezier(0.25,0.8,0.25,1);
}

.modal-header { text-align: center; margin-bottom: 28px; }

.modal-icon-wrap {
    display: inline-flex; align-items: center; justify-content: center;
    width: 64px; height: 64px; background: var(--glass-bg);
    border: 1px solid var(--glass-border); border-radius: 50%;
    margin-bottom: 16px; box-shadow: var(--glass-shadow);
}

.modal-title { font-size: 20px; font-weight: 700; color: var(--text-primary); margin-bottom: 4px; letter-spacing: -0.02em; }
.modal-subtitle { font-size: 15px; color: var(--text-secondary); font-weight: 500; }
.modal-field { margin-bottom: 24px; }

.modal-label {
    display: block; font-size: 13px; font-weight: 600;
    color: var(--text-secondary); margin-bottom: 8px; margin-left: 4px;
    text-transform: uppercase; letter-spacing: 0.03em;
}

.modal-input-wrap { position: relative; }

.modal-input {
    background: rgba(120,120,128,0.12); border: none; border-radius: 16px;
    padding: 16px 60px 16px 18px; color: var(--text-primary);
    font-size: 17px; font-family: inherit; font-weight: 500;
    transition: var(--transition); width: 100%; outline: none;
}
.modal-input:focus { background: rgba(120,120,128,0.2); box-shadow: 0 0 0 3px rgba(120,120,128,0.15); }

.modal-input-suffix {
    position: absolute; right: 18px; top: 50%;
    transform: translateY(-50%); color: var(--text-secondary);
    font-weight: 600; pointer-events: none; font-size: 15px;
}

.modal-actions { display: flex; gap: 12px; }

.modal-btn {
    flex: 1; padding: 14px 20px; border-radius: 20px;
    font-size: 17px; font-weight: 600; font-family: inherit;
    cursor: pointer; transition: var(--transition);
    display: flex; align-items: center; justify-content: center; gap: 8px;
    border: none; letter-spacing: -0.01em;
    background-color: color-mix(in srgb, var(--glass-bg) 80%, transparent);
    backdrop-filter: saturate(var(--saturation)) blur(var(--blur));
    -webkit-backdrop-filter: saturate(var(--saturation)) blur(var(--blur));
    color: var(--text-primary); height: 48px;
    box-shadow:
        inset 0 0 0 1px color-mix(in srgb, white calc(var(--glass-reflex-light) * 10%), transparent),
        inset 1.8px 3px 0px -2px color-mix(in srgb, white calc(var(--glass-reflex-light) * 90%), transparent),
        inset -2px -2px 0px -2px color-mix(in srgb, white calc(var(--glass-reflex-light) * 80%), transparent),
        inset -0.3px -1px 4px 0px color-mix(in srgb, black calc(var(--glass-reflex-dark) * 12%), transparent),
        0px 1px 5px 0px color-mix(in srgb, black calc(var(--glass-reflex-dark) * 10%), transparent),
        0px 6px 16px 0px color-mix(in srgb, black calc(var(--glass-reflex-dark) * 8%), transparent);
}
.modal-btn:hover { background-color: color-mix(in srgb, var(--glass-bg) 95%, white); }
.modal-btn:active { transform: scale(0.94); }
.modal-btn-save { background-color: color-mix(in srgb, var(--glass-bg) 90%, rgba(120,120,128,0.3)); }

/* ── Toast ── */
.toast {
    position: fixed; bottom: 100px; left: 50%;
    transform: translateX(-50%) translateY(20px);
    background: var(--glass-bg);
    backdrop-filter: saturate(var(--saturation)) blur(var(--blur));
    -webkit-backdrop-filter: saturate(var(--saturation)) blur(var(--blur));
    border: 1px solid var(--glass-border); color: var(--text-primary);
    padding: 14px 28px; border-radius: 24px; box-shadow: var(--glass-shadow);
    display: none; align-items: center; gap: 10px; z-index: 60;
    white-space: nowrap; font-size: 15px; font-weight: 600;
    opacity: 0; transition: all 0.4s cubic-bezier(0.25,0.8,0.25,1);
}

                transform 0.35s cubic-bezier(0.25,0.8,0.25,1);
}

/* Float switcher kendi view-switcher stilini miras alır */

        inset 0 0 0 1px color-mix(in srgb, white calc(var(--glass-reflex-light) * 10%), transparent),

<script>
    let loadedFilename = '';
    let code = `<!-- HTML kodunuzu buraya yazın -->
<div class="container">
  <h1>Merhaba Dünya!</h1>
  <p>Mobil editöre hoş geldiniz.</p>
</div>`;
    let isFabOpen = false;
    let isKeyboardOpen = false;
    let currentView = 'code';

    /* ── Header switcher ── */
    (function trackPrevious(el) {
        const radios = el.querySelectorAll('input[type="radio"]');
        let prev = null;
        const init = el.querySelector('input[type="radio"]:checked');
        if (init) { prev = init.getAttribute('c-option'); el.setAttribute('c-previous', prev); }
        radios.forEach(r => {
            r.addEventListener('change', () => {
                if (r.checked) {
                    el.setAttribute('c-previous', prev ?? '');
                    prev = r.getAttribute('c-option');
                    handleViewSwitch(r.value);
                }
            });
        });
    })(document.getElementById('viewSwitcher'));

    /* ── Float switcher (preview modunda sağ üst) ── */
    (function trackFloat(el) {
        const radios = el.querySelectorAll('input[type="radio"]');
        let prev = null;
        const init = el.querySelector('input[type="radio"]:checked');
        if (init) { prev = init.getAttribute('c-option'); el.setAttribute('c-previous', prev); }
        radios.forEach(r => {
            r.addEventListener('change', () => {
                if (r.checked) {
                    el.setAttribute('c-previous', prev ?? '');
                    prev = r.getAttribute('c-option');
                    handleViewSwitch(r.value);
                }
            });
        });
    })(document.getElementById('viewSwitcherFloat'));

    function syncSwitchers(view) {
        /* Header switcher */
        const headerRadio = document.querySelector('#viewSwitcher input[value="' + view + '"]');
        if (headerRadio && !headerRadio.checked) headerRadio.checked = true;

        /* Float switcher */
        const floatRadio = document.querySelector('#viewSwitcherFloat input[value="' + view + '"]');
        if (floatRadio && !floatRadio.checked) floatRadio.checked = true;
    }

    function handleViewSwitch(view) {
        currentView = view;
        const codeArea    = document.getElementById('codeArea');
        const previewArea = document.getElementById('previewArea');

        syncSwitchers(view);

        if (view === 'preview') {
            document.getElementById('previewFrameInline').srcdoc = buildPage();
            codeArea.style.display = 'none';
            previewArea.classList.add('active');
            document.body.classList.add('preview-mode');
            if (isKeyboardOpen) closeKeyboard();
            /* FAB açıksa kapat */
            if (isFabOpen) toggleFabMenu();
        } else {
            previewArea.classList.remove('active');
            codeArea.style.display = '';
            document.body.classList.remove('preview-mode');
        }
    }

    function buildPage() {
        return `<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body>${code}</body>
</html>`;
    }

    document.addEventListener('DOMContentLoaded', () => {
        loadFromStorage();
        updateEditor();
        updateFilenameDisplay();
        if ('visualViewport' in window)
            window.visualViewport.addEventListener('resize', handleVVChange);
        const ed = document.getElementById('editor');
        ed.addEventListener('focus', onEditorFocus);
        ed.addEventListener('blur',  onEditorBlur);
        window.addEventListener('beforeunload', saveToStorage);
    });

    function handleVVChange() {
        if (!window.visualViewport) return;
        const kbH = window.innerHeight - window.visualViewport.height;
        if (kbH > 50) { if (!isKeyboardOpen) { isKeyboardOpen = true; onKeyboardOpen(); } }
        else           { if (isKeyboardOpen)  { isKeyboardOpen = false; onKeyboardClose(); } }
    }

    function onEditorFocus() {
        setTimeout(() => {
            if (window.visualViewport && window.innerHeight - window.visualViewport.height > 50) {
                if (!isKeyboardOpen) { isKeyboardOpen = true; onKeyboardOpen(); }
            } else { onKeyboardOpen(); }
        }, 100);
    }

    function onEditorBlur() {
        setTimeout(() => {
            const a = document.activeElement;
            if (a !== document.getElementById('editor') && a !== document.getElementById('saveFilename'))
                if (isKeyboardOpen) { isKeyboardOpen = false; onKeyboardClose(); }
        }, 100);
    }

    function onKeyboardOpen() {
        document.body.classList.add('keyboard-open');
        document.getElementById('keyboardCloseBtn').classList.add('visible');
        document.getElementById('fabContainer').classList.add('keyboard-open');
        if (/iPad|iPhone|iPod/.test(navigator.userAgent)) {
            const st = document.getElementById('editor').scrollTop;
            Object.assign(document.body.style, { position:'fixed', width:'100%', height:'100%', top:`-${st}px` });
        }
    }

    function onKeyboardClose() {
        document.body.classList.remove('keyboard-open');
        document.getElementById('keyboardCloseBtn').classList.remove('visible');
        document.getElementById('fabContainer').classList.remove('keyboard-open');
        if (/iPad|iPhone|iPod/.test(navigator.userAgent)) {
            const st = Math.abs(parseInt(document.body.style.top || '0'));
            Object.assign(document.body.style, { position:'', width:'', height:'', top:'' });
            window.scrollTo(0, st);
        }
    }

    function closeKeyboard() {
        const ed = document.getElementById('editor'), si = document.getElementById('saveFilename');
        if (document.activeElement === ed || document.activeElement === si) document.activeElement.blur();
        if (/iPad|iPhone|iPod/.test(navigator.userAgent)) {
            const t = document.createElement('input');
            t.style.cssText = 'position:absolute;opacity:0;pointer-events:none';
            document.body.appendChild(t); t.focus();
            setTimeout(() => { t.blur(); document.body.removeChild(t); }, 0);
        }
        isKeyboardOpen = false; onKeyboardClose();
    }

    function toggleFabMenu() {
        isFabOpen = !isFabOpen;
        document.getElementById('fabMain').classList.toggle('active', isFabOpen);
        document.getElementById('fabMenu').classList.toggle('open',    isFabOpen);
        document.getElementById('fabOverlay').classList.toggle('open', isFabOpen);
    }

    function scrollToTop() {
        if (currentView === 'code') document.getElementById('editor').scrollTo({ top:0, behavior:'smooth' });
        toggleFabMenu(); showToast('Yukarı çıkıldı');
    }

    function saveToStorage() {
        localStorage.setItem('mobilKodEditor', JSON.stringify({
            code, filename: loadedFilename, timestamp: new Date().toISOString()
        }));
    }

    function loadFromStorage() {
        try {
            const d = JSON.parse(localStorage.getItem('mobilKodEditor') || '{}');
            if (d.code     !== undefined) code           = d.code;
            if (d.filename !== undefined) loadedFilename = d.filename;
        } catch(e) { console.error(e); }
    }

    function generateDefaultFilename() {
        const d = new Date(), p = n => String(n).padStart(2,'0');
        return `dosya-${p(d.getDate())}.${p(d.getMonth()+1)}.${d.getFullYear()}-${p(d.getHours())}.${p(d.getMinutes())}`;
    }

    function updateFilenameDisplay() {
        const el = document.getElementById('editorTitle');
        if (loadedFilename?.trim()) { el.textContent = loadedFilename + '.html'; el.classList.add('loaded'); }
        else { el.textContent = 'Yeni Dosya'; el.classList.remove('loaded'); }
    }

    function updateCode() {
        code = document.getElementById('editor').value;
        saveToStorage();
        if (currentView === 'preview')
            document.getElementById('previewFrameInline').srcdoc = buildPage();
    }

    function updateEditor() { document.getElementById('editor').value = code; }

    function handleKeydown(e) {
        if (e.key === 'Tab') {
            e.preventDefault();
            const el = e.target, s = el.selectionStart;
            el.value = el.value.substring(0,s) + '  ' + el.value.substring(el.selectionEnd);
            el.selectionStart = el.selectionEnd = s + 2;
            updateCode();
        }
    }

    function openSaveModal() {
        const input = document.getElementById('saveFilename');
        input.value = loadedFilename?.trim() ? loadedFilename : generateDefaultFilename();
        document.getElementById('saveModalOverlay').classList.add('open');
        setTimeout(() => { input.focus(); input.select(); }, 100);
    }

    function closeSaveModal() {
        document.getElementById('saveModalOverlay').classList.remove('open');
        if (isKeyboardOpen) closeKeyboard();
    }

    function handleOverlayClick(e) { if (e.target.id === 'saveModalOverlay') closeSaveModal(); }

    function confirmSaveFromModal() {
        let fn = document.getElementById('saveFilename').value.trim();
        if (!fn) {
            showToast('Lütfen bir dosya adı girin');
            const inp = document.getElementById('saveFilename'); inp.focus();
            ['-5px','5px','-5px','0'].forEach((x,i) => setTimeout(() => inp.style.transform = `translateX(${x})`, i*50));
            return;
        }
        if (!fn.endsWith('.html')) fn += '.html';
        const full = `<!DOCTYPE html>\n<html>\n<head>\n    <meta charset="UTF-8">\n    <meta name="viewport" content="width=device-width, initial-scale=1.0">\n    <title>${fn}</title>\n</head>\n<body>\n${code}\n</body>\n</html>`;
        const a = document.createElement('a');
        a.href = URL.createObjectURL(new Blob([full], {type:'text/html'}));
        a.download = fn; a.click();
        loadedFilename = fn.replace('.html','');
        saveToStorage(); updateFilenameDisplay();
        showToast(`${fn} indirildi`); closeSaveModal();
    }

    function loadFile() { document.getElementById('fileInput').click(); }

    function handleFileLoad(event) {
        const file = event.target.files[0]; if (!file) return;
        event.target.value = '';
        loadedFilename = file.name.replace(/\.[^/.]+$/,'');
        const r = new FileReader();
        r.onload  = e => { code = e.target.result; saveToStorage(); updateEditor(); updateFilenameDisplay(); showToast(file.name + ' yüklendi'); };
        r.onerror = () => showToast('Dosya okunamadı');
        r.readAsText(file);
    }

    function clearCode() {
        if (confirm('Tüm kodları temizlemek istediğinize emin misiniz?')) {
            code = ''; loadedFilename = '';
            saveToStorage(); updateEditor(); updateFilenameDisplay();
            /* Kod görünümüne dön */
            handleViewSwitch('code');
            showToast('Kodlar temizlendi');
        }
    }

    function copyAll() {
        const h = document.getElementById('hiddenCopyArea');
        h.value = code; h.select(); document.execCommand('copy');
        if (isFabOpen) toggleFabMenu(); showToast('Kopyalandı');
    }

    function pasteCode() {
        navigator.clipboard.readText().then(text => {
            const el = document.getElementById('editor'), s = el.selectionStart;
            el.value = el.value.substring(0,s) + text + el.value.substring(el.selectionEnd);
            el.selectionStart = el.selectionEnd = s + text.length;
            updateCode(); if (isFabOpen) toggleFabMenu(); showToast('Yapıştırıldı');
        }).catch(() => showToast('Yapıştırma başarısız'));
    }

    let toastTimer;
    function showToast(msg) {
        const t = document.getElementById('toast');
        document.getElementById('toastMessage').textContent = msg;
        t.classList.add('open');
        clearTimeout(toastTimer);
        toastTimer = setTimeout(() => t.classList.remove('open'), 2000);
    }
</script>

</body>
</html>
